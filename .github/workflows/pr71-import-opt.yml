name: PR71 canonical import optimization
on:
  push:
    branches:
      - feature/internal-config-storage
    paths:
      - .github/workflows/pr71-import-opt.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply import optimization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 .github/pr71_import_opt.py
          git rm .github/pr71_import_opt.py .github/workflows/pr71-import-opt.yml
          git add main/device_config.c
          git commit -m "Avoid redundant canonical import rewrite"
          git push origin HEAD:feature/internal-config-storage
