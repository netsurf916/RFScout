name: PR47 lifecycle patch

on:
  push:
    branches:
      - stabilize-app-lifecycle-ui

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: stabilize-app-lifecycle-ui
          fetch-depth: 0

      - name: Install clang-format 18
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-format-18

      - name: Apply narrow lifecycle and UI changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          p = Path("main/app_manager.c")
          text = p.read_text()
          text = text.replace('#include "esp_log.h"\n#include "esp_timer.h"', '#include "esp_heap_caps.h"\n#include "esp_log.h"\n#include "esp_timer.h"', 1)
          text = text.replace('#define APP_RADIO_RETRY_INTERVAL_US 1000000LL', '#define APP_RADIO_RETRY_INTERVAL_US 1000000LL\n#define APP_ACTIVATION_DELAY_US 500000LL', 1)
          text = text.replace('static int64_t last_radio_retry_us;\n', 'static int64_t last_radio_retry_us;\nstatic int64_t app_entered_us;\nstatic bool app_activated;\n', 1)

          marker = '''static void notify_detection( rfscout_notification_type_t a_type )\n'''
          helper = '''static bool app_requires_activation( rfscout_app_id_t a_app )\n{\n    return ( RFSCOUT_APP_WIFI_BT == a_app ) || ( RFSCOUT_APP_CC1101 == a_app ) ||\n           ( RFSCOUT_APP_NRF24 == a_app ) || ( RFSCOUT_APP_THERMAL == a_app );\n}\n\nstatic void log_lifecycle( const char *a_phase,\n                           rfscout_app_id_t a_from,\n                           rfscout_app_id_t a_to,\n                           int64_t a_elapsed_us )\n{\n    ESP_LOGI( TAG,\n              "%s from=%d to=%d elapsed=%lldus heap=%u min=%u largest=%u",\n              a_phase,\n              (int)a_from,\n              (int)a_to,\n              (long long)a_elapsed_us,\n              (unsigned)heap_caps_get_free_size( MALLOC_CAP_8BIT ),\n              (unsigned)heap_caps_get_minimum_free_size( MALLOC_CAP_8BIT ),\n              (unsigned)heap_caps_get_largest_free_block( MALLOC_CAP_8BIT ) );\n}\n\nstatic void activate_app( void )\n{\n    if( app_activated )\n    {\n        return;\n    }\n\n    const int64_t started = esp_timer_get_time();\n    app_activated = true;\n    switch( active_app )\n    {\n        case RFSCOUT_APP_WIFI_BT:\n            last_radio_retry_us = started;\n            start_wifi_bt_collectors();\n            break;\n        case RFSCOUT_APP_CC1101:\n            if( ESP_OK != cc1101_start() )\n            {\n                ESP_LOGW( TAG, "CC1101 unavailable" );\n            }\n            break;\n        case RFSCOUT_APP_NRF24:\n            if( ESP_OK != nrf24_start() )\n            {\n                ESP_LOGW( TAG, "nRF24 unavailable" );\n            }\n            break;\n        case RFSCOUT_APP_THERMAL:\n        case RFSCOUT_APP_AUDIO:\n        case RFSCOUT_APP_DEVICE:\n        case RFSCOUT_APP_COUNT:\n        default:\n            break;\n    }\n    log_lifecycle( "activate", active_app, active_app, esp_timer_get_time() - started );\n}\n\nstatic void activate_app_if_ready( int64_t a_now )\n{\n    if( !app_activated && ( a_now - app_entered_us >= APP_ACTIVATION_DELAY_US ) )\n    {\n        activate_app();\n    }\n}\n\n'''
          if marker not in text:
              raise SystemExit("notify_detection marker not found")
          text = text.replace(marker, helper + marker, 1)

          text = text.replace('''    if( RFSCOUT_APP_WIFI_BT == a_app )\n    {\n        (void)ble_monitor_stop();\n        (void)radio_monitor_stop();\n        wifi_monitor_ready = false;\n        ble_monitor_ready = false;\n        wifi_item = WIFI_MENU_BACK;\n    }\n    else if( RFSCOUT_APP_CC1101 == a_app )\n    {\n        cc1101_stop();\n''', '''    if( RFSCOUT_APP_WIFI_BT == a_app )\n    {\n        if( app_activated )\n        {\n            (void)ble_monitor_stop();\n            (void)radio_monitor_stop();\n        }\n        wifi_monitor_ready = false;\n        ble_monitor_ready = false;\n        wifi_item = WIFI_MENU_BACK;\n    }\n    else if( RFSCOUT_APP_CC1101 == a_app )\n    {\n        if( app_activated )\n        {\n            cc1101_stop();\n        }\n''', 1)
          text = text.replace('''    else if( RFSCOUT_APP_NRF24 == a_app )\n    {\n        nrf24_stop();\n''', '''    else if( RFSCOUT_APP_NRF24 == a_app )\n    {\n        if( app_activated )\n        {\n            nrf24_stop();\n        }\n''', 1)
          text = text.replace('''    else if( RFSCOUT_APP_AUDIO == a_app )\n    {\n        audio_spectrum_stop();\n        audio_item = AUDIO_BROWSER_BACK;\n    }\n''', '''    else if( RFSCOUT_APP_AUDIO == a_app )\n    {\n        recorder_stop();\n        audio_spectrum_stop();\n        audio_item = AUDIO_BROWSER_BACK;\n    }\n''', 1)

          text = text.replace('''static void enter_app( rfscout_app_id_t a_app )\n{\n    last_app_refresh_us = 0;\n''', '''static void enter_app( rfscout_app_id_t a_app )\n{\n    last_app_refresh_us = 0;\n    app_entered_us = esp_timer_get_time();\n    app_activated = !app_requires_activation( a_app );\n''', 1)
          text = text.replace('''            last_radio_retry_us = esp_timer_get_time();\n            start_wifi_bt_collectors();\n            break;\n''', '''            last_radio_retry_us = 0;\n            break;\n''', 1)
          text = text.replace('''            cc1101_activity_reset();\n            if( ESP_OK != cc1101_start() )\n            {\n                ESP_LOGW( TAG, "CC1101 unavailable" );\n            }\n            render_cc_spectrum();\n''', '''            cc1101_activity_reset();\n            render_cc_spectrum();\n''', 1)
          text = text.replace('''            nrf24_activity_reset();\n            if( ESP_OK != nrf24_start() )\n            {\n                ESP_LOGW( TAG, "nRF24 unavailable" );\n            }\n            render_nr_spectrum();\n''', '''            nrf24_activity_reset();\n            render_nr_spectrum();\n''', 1)
          text = text.replace('''            audio_last_state = RFSCOUT_RECORDER_IDLE;\n            if( ESP_OK != audio_spectrum_start() )\n            {\n                ESP_LOGW( TAG, "Audio microphone unavailable" );\n            }\n            render_audio();\n''', '''            audio_last_state = RFSCOUT_RECORDER_IDLE;\n            render_audio();\n''', 1)

          text = text.replace('''    leave_app( active_app );\n    active_app = candidate;\n    enter_app( active_app );\n''', '''    const rfscout_app_id_t previous = active_app;\n    const int64_t transition_started = esp_timer_get_time();\n    leave_app( previous );\n    active_app = candidate;\n    enter_app( active_app );\n    log_lifecycle( "transition",\n                   previous,\n                   active_app,\n                   esp_timer_get_time() - transition_started );\n''', 1)

          text = text.replace('''    last_radio_retry_us = 0;\n    wifi_menu = false;\n''', '''    last_radio_retry_us = 0;\n    app_entered_us = 0;\n    app_activated = false;\n    wifi_menu = false;\n''', 1)
          text = text.replace('''    wifi_monitor_ready = true;\n    ble_monitor_ready = true;\n''', '''    wifi_monitor_ready = false;\n    ble_monitor_ready = false;\n''', 1)
          text = text.replace('''    else if( RFSCOUT_APP_WIFI_BT != active_app )\n    {\n        enter_app( active_app );\n    }\n''', '''    else\n    {\n        enter_app( active_app );\n    }\n''', 1)

          text = text.replace('''    if( RFSCOUT_APP_CC1101 == active_app )\n    {\n        if( cc_menu )\n        {\n            cc_input( pressed, delta );\n            return;\n        }\n        if( pressed )\n        {\n            cc_input( true, 0 );\n            return;\n        }\n        if( switch_app_for_delta( delta, now ) )\n        {\n            return;\n        }\n        cc1101_poll();\n''', '''    if( RFSCOUT_APP_CC1101 == active_app )\n    {\n        if( cc_menu )\n        {\n            activate_app_if_ready( now );\n            cc_input( pressed, delta );\n            return;\n        }\n        if( pressed )\n        {\n            activate_app_if_ready( now );\n            cc_input( true, 0 );\n            return;\n        }\n        if( switch_app_for_delta( delta, now ) )\n        {\n            return;\n        }\n        activate_app_if_ready( now );\n        if( !app_activated )\n        {\n            return;\n        }\n        cc1101_poll();\n''', 1)

          text = text.replace('''    if( RFSCOUT_APP_NRF24 == active_app )\n    {\n        if( nr_menu )\n        {\n            nr_input( pressed, delta );\n            return;\n        }\n        if( pressed )\n        {\n            nr_input( true, 0 );\n            return;\n        }\n        if( switch_app_for_delta( delta, now ) )\n        {\n            return;\n        }\n        nrf24_poll();\n''', '''    if( RFSCOUT_APP_NRF24 == active_app )\n    {\n        if( nr_menu )\n        {\n            activate_app_if_ready( now );\n            nr_input( pressed, delta );\n            return;\n        }\n        if( pressed )\n        {\n            activate_app_if_ready( now );\n            nr_input( true, 0 );\n            return;\n        }\n        if( switch_app_for_delta( delta, now ) )\n        {\n            return;\n        }\n        activate_app_if_ready( now );\n        if( !app_activated )\n        {\n            return;\n        }\n        nrf24_poll();\n''', 1)

          text = text.replace('''    if( RFSCOUT_APP_WIFI_BT == active_app )\n    {\n        if( wifi_menu )\n        {\n            wifi_input( pressed, delta );\n        }\n        else if( pressed )\n        {\n            wifi_input( true, 0 );\n        }\n        else if( switch_app_for_delta( delta, now ) )\n        {\n            return;\n        }\n        if( ( !wifi_monitor_ready || !ble_monitor_ready ) &&\n''', '''    if( RFSCOUT_APP_WIFI_BT == active_app )\n    {\n        if( wifi_menu )\n        {\n            activate_app_if_ready( now );\n            wifi_input( pressed, delta );\n        }\n        else if( pressed )\n        {\n            activate_app_if_ready( now );\n            wifi_input( true, 0 );\n        }\n        else if( switch_app_for_delta( delta, now ) )\n        {\n            return;\n        }\n        else\n        {\n            activate_app_if_ready( now );\n        }\n        if( !app_activated )\n        {\n            if( !wifi_menu )\n            {\n                ui_poll();\n            }\n            return;\n        }\n        if( ( !wifi_monitor_ready || !ble_monitor_ready ) &&\n''', 1)

          text = text.replace('''    if( RFSCOUT_APP_THERMAL != active_app )\n    {\n        return;\n    }\n    if( !mlx90640_is_detected() )\n''', '''    if( RFSCOUT_APP_THERMAL != active_app )\n    {\n        return;\n    }\n    activate_app_if_ready( now );\n    if( !app_activated )\n    {\n        return;\n    }\n    if( !mlx90640_is_detected() )\n''', 1)
          p.write_text(text)

          # Direct center-button toggles for simple Device settings.
          p = Path("main/device_view.c")
          text = p.read_text()
          marker = '''static bool item_editable( unsigned a_item )\n'''
          helper = '''static bool item_direct_toggle( unsigned a_item )\n{\n    return ( DEVICE_ITEM_CLOCK_FORMAT == a_item ) || ( DEVICE_ITEM_WIFI == a_item ) ||\n           ( DEVICE_ITEM_CC1101 == a_item ) || ( DEVICE_ITEM_NRF24 == a_item ) ||\n           ( DEVICE_ITEM_AUDIO == a_item ) || ( DEVICE_ITEM_THERMAL == a_item ) ||\n           ( DEVICE_ITEM_LOGGING == a_item );\n}\n\n'''
          if marker not in text:
              raise SystemExit("device item_editable marker not found")
          text = text.replace(marker, helper + marker, 1)
          text = text.replace('''              editing ? "TURN CHANGE / CENTER DONE" : "TURN SELECT / CENTER ENTER" );\n''', '''              editing ? "TURN CHANGE / CENTER DONE"\n                      : ( item_direct_toggle( selected_item ) ? "CENTER TOGGLE"\n                                                              : "TURN SELECT / CENTER ENTER" ) );\n''', 1)
          text = text.replace('''        if( ( DEVICE_ITEM_SAVE == selected_item ) && !editing )\n        {\n            save_error = ( ESP_OK != device_config_save( false, 0, NULL ) );\n            emit_device_event( save_error ? RFSCOUT_EVENT_ERROR : RFSCOUT_EVENT_ACTIVATE,\n                               save_error ? -1 : 0 );\n            device_view_render();\n            return false;\n        }\n\n        bool accepted = true;\n''', '''        if( ( DEVICE_ITEM_SAVE == selected_item ) && !editing )\n        {\n            save_error = ( ESP_OK != device_config_save( false, 0, NULL ) );\n            emit_device_event( save_error ? RFSCOUT_EVENT_ERROR : RFSCOUT_EVENT_ACTIVATE,\n                               save_error ? -1 : 0 );\n            device_view_render();\n            return false;\n        }\n        if( !editing && item_direct_toggle( selected_item ) )\n        {\n            adjust_selected( 1 );\n            device_view_render();\n            return false;\n        }\n\n        bool accepted = true;\n''', 1)
          p.write_text(text)

          # Thermal data keeps its literal palette; chrome and labels use semantic theme roles.
          p = Path("main/thermal_view.c")
          text = p.read_text()
          text = text.replace('#include "ui_chrome.h"\n', '#include "ui_chrome.h"\n#include "ui_theme.h"\n', 1)
          text = text.replace('''    display_clear( COLOR_BLACK );\n    ui_chrome_draw( "THERMAL", COLOR_SUBDUED_TEAL );\n''', '''    const ui_theme_palette_t *theme = ui_theme_get();\n    display_clear( theme->background );\n    ui_chrome_draw( "THERMAL", theme->secondary );\n''', 1)
          text = text.replace('display_draw_text( 56, 70, "MLX90640 NOT DETECTED", COLOR_RED, 2 );', 'display_draw_text( 56, 70, "MLX90640 NOT DETECTED", theme->error, 2 );', 1)
          text = text.replace('display_draw_text( 73, 98, "I2C ADDRESS 0x33", COLOR_GRAY, 1 );', 'display_draw_text( 73, 98, "I2C ADDRESS 0x33", theme->info, 1 );', 1)
          text = text.replace('display_draw_text( 72, 76, "THERMAL READ ERROR", COLOR_RED, 2 );', 'display_draw_text( 72, 76, "THERMAL READ ERROR", theme->error, 2 );', 1)
          text = text.replace('''                       COLOR_WHITE );\n    display_fill_rect( THERMAL_IMAGE_X + ( THERMAL_IMAGE_WIDTH / 2 ),''', '''                       theme->text );\n    display_fill_rect( THERMAL_IMAGE_X + ( THERMAL_IMAGE_WIDTH / 2 ),''', 1)
          text = text.replace('''                       COLOR_WHITE );\n\n    char text[ 24 ];\n    display_draw_text( THERMAL_INFO_X, 30, "RELATIVE IR", COLOR_GRAY, 1 );\n''', '''                       theme->text );\n\n    char text[ 24 ];\n    display_draw_text( THERMAL_INFO_X, 30, "RELATIVE IR", theme->info, 1 );\n''', 1)
          text = text.replace('display_draw_text( THERMAL_INFO_X, 52, text, COLOR_WHITE, 1 );', 'display_draw_text( THERMAL_INFO_X, 52, text, theme->text, 1 );', 1)
          text = text.replace('display_draw_text( THERMAL_INFO_X, 68, text, COLOR_WHITE, 1 );', 'display_draw_text( THERMAL_INFO_X, 68, text, theme->text, 1 );', 1)
          text = text.replace('display_draw_text( THERMAL_INFO_X, 84, text, COLOR_WHITE, 1 );', 'display_draw_text( THERMAL_INFO_X, 84, text, theme->text, 1 );', 1)
          text = text.replace('display_draw_text( THERMAL_INFO_X, 116, "32x24 SENSOR", COLOR_GRAY, 1 );', 'display_draw_text( THERMAL_INFO_X, 116, "32x24 SENSOR", theme->info, 1 );', 1)
          text = text.replace('display_draw_text( THERMAL_INFO_X, 130, "CAL PENDING", COLOR_GRAY, 1 );', 'display_draw_text( THERMAL_INFO_X, 130, "CAL PENDING", theme->info, 1 );', 1)
          p.write_text(text)
          PY

          clang-format-18 -i main/app_manager.c main/device_view.c main/thermal_view.c

      - name: Commit patch and remove helper workflow
        run: |
          rm .github/workflows/pr47-lifecycle-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main/app_manager.c main/device_view.c main/thermal_view.c .github/workflows/pr47-lifecycle-patch.yml
          git diff --cached --check
          git commit -m "Implement settled app activation and UI normalization"
          git push origin HEAD:stabilize-app-lifecycle-ui
