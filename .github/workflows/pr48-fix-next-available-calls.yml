name: PR48 fix next_available_app calls

on: [push]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: detect-radio-hardware-apps
      - name: Fix remaining call sites
        run: >-
          python3 -c 'from pathlib import Path; p=Path("main/app_manager.c"); s=p.read_text(); old="next_available_app( 1, now )"; n=s.count(old); assert n==2, n; p.write_text(s.replace(old,"next_available_app( 1 )"))'
      - name: Format and commit
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18
          clang-format-18 -i main/app_manager.c
          git config user.name "Daniel Wilson"
          git config user.email "netsurf916@users.noreply.github.com"
          git add main/app_manager.c
          git commit -m "Fix remaining app availability call sites"
          git push origin HEAD:detect-radio-hardware-apps
