name: PR radio presence patch
on:
  push:
    branches: [detect-radio-hardware-apps]
    paths: [.github/workflows/pr-radio-presence.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: detect-radio-hardware-apps
      - name: Apply hardware presence gating
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('main/app_manager.c')
          s = p.read_text()
          s = s.replace(
              'static bool wifi_monitor_ready;\nstatic bool ble_monitor_ready;\n',
              'static bool wifi_monitor_ready;\nstatic bool ble_monitor_ready;\nstatic bool cc1101_available;\nstatic bool nrf24_available;\n'
          )
          s = s.replace(
              '    if( !device_config_app_enabled( a_app ) )\n    {\n        return false;\n    }\n    return ( RFSCOUT_APP_THERMAL != a_app ) || mlx90640_is_detected();\n',
              '    if( !device_config_app_enabled( a_app ) )\n    {\n        return false;\n    }\n    if( RFSCOUT_APP_CC1101 == a_app )\n    {\n        return cc1101_available;\n    }\n    if( RFSCOUT_APP_NRF24 == a_app )\n    {\n        return nrf24_available;\n    }\n    return ( RFSCOUT_APP_THERMAL != a_app ) || mlx90640_is_detected();\n'
          )
          s = s.replace(
              '    wifi_monitor_ready = false;\n    ble_monitor_ready = false;\n',
              '    wifi_monitor_ready = false;\n    ble_monitor_ready = false;\n    cc1101_available = false;\n    nrf24_available = false;\n',
              1
          )
          s = s.replace(
              '    (void)mlx90640_init();\n    if( have_restored_session && app_available( restored_session.active_app ) )\n',
              '    (void)mlx90640_init();\n\n    const esp_err_t cc1101_result = cc1101_init();\n    cc1101_available = ( ESP_OK == cc1101_result );\n    ESP_LOGI( TAG,\n              "CC1101 hardware %s",\n              cc1101_available ? "detected; app available" : "not detected; app hidden" );\n\n    const esp_err_t nrf24_result = nrf24_init();\n    nrf24_available = ( ESP_OK == nrf24_result );\n    ESP_LOGI( TAG,\n              "nRF24 hardware %s",\n              nrf24_available ? "detected; app available" : "not detected; app hidden" );\n\n    if( have_restored_session && app_available( restored_session.active_app ) )\n'
          )
          p.write_text(s)

          p = Path('docs/ARCHITECTURE.md')
          s = p.read_text()
          s = s.replace(
              'WiFi / BT -> CC1101 -> nRF24 -> Recorder -> Thermal (when enabled and present) -> Home / Device Settings',
              'WiFi / BT -> CC1101 (when enabled and detected) -> nRF24 (when enabled and detected) -> Recorder -> Thermal (when enabled and present) -> Home / Device Settings'
          )
          s = s.replace(
              'RFScout defaults to Home at startup. `device_config` persists a preferred startup application through `apps.startup`; `app_manager` validates that preference against application enablement and runtime hardware availability. A disabled or unavailable target falls back to Home for the current boot without rewriting the saved preference.\n',
              'RFScout defaults to Home at startup. `device_config` persists a preferred startup application through `apps.startup`; `app_manager` validates that preference against application enablement and runtime hardware availability. A disabled or unavailable target falls back to Home for the current boot without rewriting the saved preference.\n\nCC1101 and nRF24 are treated as board-population capabilities rather than hot-plug peripherals. `app_manager` probes each once during startup and includes its application in navigation only when initialization confirms that the radio is present. RFScout does not add status-bar indicators for these fixed radios. Thermal remains different: it is an explicitly attachable external sensor, so its runtime probe and availability feedback remain dynamic.\n'
          )
          p.write_text(s)

          p = Path('docs/CONFIGURATION.md')
          s = p.read_text()
          s = s.replace(
              'The historical configuration key remains `apps.audio` because the application enum still uses `RFSCOUT_APP_AUDIO`; the user-facing application is Recorder. `apps.startup` writes user-facing aliases where useful: `home` for Device and `recorder` for Audio. The loader also accepts the historical internal names `device` and `audio`.\n',
              'The historical configuration key remains `apps.audio` because the application enum still uses `RFSCOUT_APP_AUDIO`; the user-facing application is Recorder. `apps.startup` writes user-facing aliases where useful: `home` for Device and `recorder` for Audio. The loader also accepts the historical internal names `device` and `audio`.\n\nAn application `enabled` value is a user preference, not a promise that the hardware exists. CC1101 and nRF24 are additionally gated by a one-time startup hardware probe; if the corresponding radio is absent, that application is omitted from navigation for the current boot even when configured enabled. The saved preference is preserved so the same configuration can be used across differently populated T-Embed variants. Thermal remains dynamically probed because it is an external attachable peripheral.\n'
          )
          p.write_text(s)

          p = Path('docs/BOARD_PORTING.md')
          s = p.read_text()
          s = s.replace(
              'Capabilities are compile-time constants by design. As drivers are separated into target-specific source sets, CMake should use the selected board and its capabilities to avoid compiling unsupported hardware into that firmware image.\n',
              'Capabilities are compile-time constants by design. As drivers are separated into target-specific source sets, CMake should use the selected board and its capabilities to avoid compiling unsupported hardware into that firmware image. Compile-time capability means that a board target can support a device; it does not require every product variant using that target to populate the device. Fixed optional radios such as CC1101 and nRF24 may therefore be probed once at startup and exposed only when detected.\n'
          )
          p.write_text(s)
          PY
      - name: Install clang-format 18
        run: sudo apt-get update -qq && sudo apt-get install -y clang-format-18
      - name: Format, commit, and remove helper workflow
        shell: bash
        run: |
          clang-format-18 -i main/app_manager.c
          rm .github/workflows/pr-radio-presence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main/app_manager.c docs/ARCHITECTURE.md docs/CONFIGURATION.md docs/BOARD_PORTING.md .github/workflows/pr-radio-presence.yml
          git commit -m "Gate fixed radio apps by detected hardware"
          git push origin HEAD:detect-radio-hardware-apps
