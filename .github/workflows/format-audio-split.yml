name: Format audio split

on:
  push:
    branches:
      - refactor/app-runtime-dispatch

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message == 'Apply canonical formatting to audio split'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/app-runtime-dispatch
          fetch-depth: 0
      - name: Install clang-format 18
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18
      - name: Format and commit
        run: |
          python3 tools/check_format.py --fix
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply canonical formatting"
          git push origin HEAD:refactor/app-runtime-dispatch
