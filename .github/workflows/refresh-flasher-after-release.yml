name: Refresh Pages after release preparation

on:
  workflow_run:
    workflows:
      - Prepare firmware release
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:
  refresh:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Refresh RFScout Pages from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run web-flasher.yml --repo "$GITHUB_REPOSITORY" --ref main
