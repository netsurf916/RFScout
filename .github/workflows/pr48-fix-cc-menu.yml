name: PR48 fix CC menu values

on:
  push:
    branches:
      - detect-radio-hardware-apps

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: detect-radio-hardware-apps
      - name: Fix value row mapping
        shell: python
        run: |
          from pathlib import Path
          p = Path("main/radio_app_view.c")
          text = p.read_text()
          old = '''        value[ 0 ] = '\\0';
                  if( 2U == i )
                  {
                      snprintf( value, sizeof( value ), "%s", ( NULL != a_profile ) ? a_profile : "?" );
                  }
                  else if( 6U == i )
                  {
                      snprintf( value,
                                sizeof( value ),
                                "%lu.%03lu MHz",
                                (unsigned long)( a_low_khz / 1000U ),
                                (unsigned long)( a_low_khz % 1000U ) );
                  }
                  else if( 3U == i )
                  {
                      snprintf( value,
                                sizeof( value ),
                                "%lu.%03lu MHz",
                                (unsigned long)( a_high_khz / 1000U ),
                                (unsigned long)( a_high_khz % 1000U ) );
                  }
                  else if( 4U == i )
                  {
                      snprintf( value, sizeof( value ), "%lu kHz", (unsigned long)a_step_khz );
                  }
                  else if( 5U == i )
                  {
                      snprintf( value, sizeof( value ), "%s", a_notifications_enabled ? "ON" : "OFF" );
                  }'''
          new = '''        value[ 0 ] = '\\0';
                  if( 2U == i )
                  {
                      snprintf( value, sizeof( value ), "%s", ( NULL != a_profile ) ? a_profile : "?" );
                  }
                  else if( 3U == i )
                  {
                      snprintf( value,
                                sizeof( value ),
                                "%lu.%03lu MHz",
                                (unsigned long)( a_low_khz / 1000U ),
                                (unsigned long)( a_low_khz % 1000U ) );
                  }
                  else if( 4U == i )
                  {
                      snprintf( value,
                                sizeof( value ),
                                "%lu.%03lu MHz",
                                (unsigned long)( a_high_khz / 1000U ),
                                (unsigned long)( a_high_khz % 1000U ) );
                  }
                  else if( 5U == i )
                  {
                      snprintf( value, sizeof( value ), "%lu kHz", (unsigned long)a_step_khz );
                  }
                  else if( 6U == i )
                  {
                      snprintf( value, sizeof( value ), "%s", a_notifications_enabled ? "ON" : "OFF" );
                  }'''
          if old not in text:
              raise SystemExit("CC1101 value block not found")
          p.write_text(text.replace(old, new, 1))
      - name: Install clang-format 18
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18
      - name: Format and commit
        run: |
          clang-format-18 -i main/radio_app_view.c
          rm .github/workflows/pr48-fix-cc-menu.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main/radio_app_view.c .github/workflows/pr48-fix-cc-menu.yml
          git commit -m "Fix reordered CC1101 menu values"
          git push origin HEAD:detect-radio-hardware-apps
