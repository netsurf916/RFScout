name: PR48 source fixes

on: [push]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: detect-radio-hardware-apps
      - name: Fix stale hotplug navigation path
        run: >-
          python3 -c 'from pathlib import Path; p=Path("main/app_manager.c"); s=p.read_text(); old="            if( RFSCOUT_APP_THERMAL == candidate )\n            {\n                last_thermal_probe_us = a_now;\n                if( device_config_app_enabled( candidate ) && probe_thermal() )\n                {\n                    return candidate;\n                }\n            }\n            continue;"; new="            if( RFSCOUT_APP_PROBE_HOTPLUG == app_framework_probe_policy( candidate ) )\n            {\n                app_framework_refresh_hotplug( candidate );\n                last_hotplug_probe_us = a_now;\n                if( app_available( candidate ) )\n                {\n                    return candidate;\n                }\n            }\n            continue;"; assert old in s; p.write_text(s.replace(old,new,1))'
      - name: Fix CC1101 cleanup on probe exits
        run: >-
          python3 -c 'from pathlib import Path; p=Path("main/cc1101.c"); s=p.read_text(); old="            scan_task = NULL;\n            return ESP_ERR_NO_MEM;"; new="            scan_task = NULL;\n            (void)strobe( CC1101_SIDLE );\n            (void)strobe( CC1101_SPWD );\n            disable_rf_path();\n            return ESP_ERR_NO_MEM;"; assert old in s; s=s.replace(old,new,1); old2="    if( detected )\n    {\n        (void)strobe( CC1101_SIDLE );\n        (void)strobe( CC1101_SPWD );\n        disable_rf_path();\n    }\n    return detected ? ESP_OK : ESP_ERR_NOT_FOUND;"; new2="    (void)strobe( CC1101_SIDLE );\n    (void)strobe( CC1101_SPWD );\n    disable_rf_path();\n    return detected ? ESP_OK : ESP_ERR_NOT_FOUND;"; assert old2 in s; p.write_text(s.replace(old2,new2,1))'
      - name: Format and commit
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18
          clang-format-18 -i main/app_manager.c main/cc1101.c
          git config user.name "Daniel Wilson"
          git config user.email "netsurf916@users.noreply.github.com"
          git add main/app_manager.c main/cc1101.c
          git commit -m "Fix availability navigation and CC1101 probe cleanup"
          git push origin HEAD:detect-radio-hardware-apps
