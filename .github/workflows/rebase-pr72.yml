name: Rebase PR72 onto main
on:
  push:
    branches:
      - design/service-provider-events
    paths:
      - .github/workflows/rebase-pr72.yml
permissions:
  contents: write
jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Rebase branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash .github/rebase_pr72.sh
# retry 3
