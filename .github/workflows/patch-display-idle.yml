name: Apply display idle implementation patch

on:
  push:
    branches:
      - display-idle-dim-off
    paths:
      - tools/patch_display_idle.py
      - .github/workflows/patch-display-idle.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: display-idle-dim-off
      - name: Apply implementation
        run: python3 tools/patch_display_idle.py
      - name: Remove patch helper
        run: rm tools/patch_display_idle.py .github/workflows/patch-display-idle.yml
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement global display idle dim and off"
          git push origin HEAD:display-idle-dim-off
