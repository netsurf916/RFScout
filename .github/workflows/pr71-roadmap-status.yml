name: PR71 roadmap status cleanup
on:
  push:
    branches:
      - feature/internal-config-storage
    paths:
      - .github/workflows/pr71-roadmap-status.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply roadmap terminology cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 .github/pr71_roadmap_status.py
          git rm .github/pr71_roadmap_status.py .github/workflows/pr71-roadmap-status.yml
          git add docs/ROADMAP.md
          git commit -m "Align roadmap with strict configuration semantics"
          git push origin HEAD:feature/internal-config-storage
