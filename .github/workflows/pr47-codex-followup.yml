name: PR47 Codex follow-up

on:
  push:
    branches:
      - stabilize-app-lifecycle-ui

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: stabilize-app-lifecycle-ui
          fetch-depth: 0

      - name: Apply quiesce rollback fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"pattern not found in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          for path, timeout_name in [
              ("main/cc1101.c", "CC1101_STOP_TIMEOUT_MS"),
              ("main/nrf24.c", "NRF24_STOP_TIMEOUT_MS"),
          ]:
              old = f'''    if( worker_active )\n    {{\n        running = true;\n        ESP_LOGE( TAG,\n                  "scan worker did not quiesce within %u ms; resuming scan",\n                  (unsigned){timeout_name} );\n        return false;\n    }}'''
              new = f'''    if( worker_active )\n    {{\n        running = true;\n        if( NULL != scan_task )\n        {{\n            xTaskNotifyGive( scan_task );\n        }}\n        ESP_LOGE( TAG,\n                  "scan worker did not quiesce within %u ms; resuming scan",\n                  (unsigned){timeout_name} );\n        return false;\n    }}'''
              replace_once(path, old, new)

          replace_once(
              "main/app_manager.c",
              '''        if( app_activated && !cc1101_stop() )\n        {\n            quiesced = false;\n        }\n        cc1101_activity_reset();''',
              '''        if( app_activated && !cc1101_stop() )\n        {\n            return false;\n        }\n        cc1101_activity_reset();''')

          replace_once(
              "main/app_manager.c",
              '''        if( app_activated && !nrf24_stop() )\n        {\n            quiesced = false;\n        }\n        nrf24_activity_reset();''',
              '''        if( app_activated && !nrf24_stop() )\n        {\n            return false;\n        }\n        nrf24_activity_reset();''')

          p = Path("docs/APP_LIFECYCLE.md")
          text = p.read_text()
          old = "If bounded quiesce fails, the application transition is aborted. RFScout must retain ownership with the current application rather than allow the next application to begin using a resource that may still be active. A stop implementation that has already withdrawn its run request must roll that request back on timeout so the retained application remains operational rather than becoming a selected-but-inactive view."
          new = old + " Failed quiesce must also preserve the retained application's runtime counters, detection history, and menu state; exit cleanup occurs only after quiescence succeeds. A rollback that resumes a persistent worker must explicitly wake that worker so a race with its active-to-waiting transition cannot leave the retained app dormant."
          if old not in text:
              raise SystemExit("lifecycle contract paragraph not found")
          p.write_text(text.replace(old, new, 1))

      - name: Install clang-format 18
        run: sudo apt-get update && sudo apt-get install -y clang-format-18

      - name: Format, commit, and remove helper workflow
        run: |
          clang-format-18 -i main/app_manager.c main/cc1101.c main/nrf24.c
          rm .github/workflows/pr47-codex-followup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main/app_manager.c main/cc1101.c main/nrf24.c docs/APP_LIFECYCLE.md .github/workflows/pr47-codex-followup.yml
          git commit -m "Fix quiesce rollback races"
          git push origin HEAD:stabilize-app-lifecycle-ui
