name: Align storage roadmap documentation
on:
  push:
    branches:
      - feature/internal-config-storage
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/internal-config-storage
      - name: Align roadmap and production docs
        shell: python
        run: |
          from pathlib import Path

          path = Path('docs/ROADMAP.md')
          text = path.read_text()
          text = text.replace(
              '**Status:** Implemented by PR #60; release-level combination/migration validation remains open.',
              '**Status:** Implemented by PR #60; release-level combination/configuration validation remains open.'
          )
          text = text.replace(
              '- legacy Discipline migrates to Night + Quiet with the intended migrated environmental gains;\n- recognized older configuration is migrated best-effort while unsupported/unusable pre-1.0 configuration may be regenerated from current defaults.',
              '- the legacy `discipline` token is normalized to Night + Quiet when encountered inside an otherwise current-schema configuration;\n- incompatible internal configuration schemas are replaced with current compiled defaults rather than migrated or retained as recovery copies.'
          )
          text = text.replace(
              '- [ ] Verify recognized schema migration/default regeneration.\n- [ ] Verify migrated gains and complete theme/audio independence.',
              '- [ ] Verify incompatible-schema/default regeneration.\n- [ ] Verify current-schema legacy-token normalization and complete theme/audio independence.'
          )
          text = text.replace(
              '- charger connect/disconnect, startup SD mount/mount-failure, and Thermal availability events;',
              '- charger connect/disconnect, startup SD and internal-storage status, configuration import/default recovery, and Thermal availability events;'
          )
          text = text.replace(
              '- [ ] Theme selection and Normal/Quiet audio policy operate independently with migration/default behavior verified.',
              '- [ ] Theme selection and Normal/Quiet audio policy operate independently with current-schema normalization/default-replacement behavior verified.'
          )
          text = text.replace(
              '- persist user-defined strings in `/sdcard/rfscout.json`;',
              '- persist user-defined strings through the planned system-owned internal record service rather than SD configuration or app-owned filesystem paths;'
          )
          text = text.replace(
              'Candidate diagnostics include board/reset identity, flash/PSRAM/heap, SD state/errors, battery/power, WiFi/BLE, CC1101/nRF24, microphone clock/rate/gain/clipping, speaker state, and GPS/RTC state when implemented.',
              'Candidate diagnostics include board/reset identity, flash/PSRAM/heap, internal persistence state/errors, SD state/errors, battery/power, WiFi/BLE, CC1101/nRF24, microphone clock/rate/gain/clipping, speaker state, and GPS/RTC state when implemented.'
          )
          path.write_text(text)

          path = Path('docs/ARCHITECTURE.md')
          text = path.read_text()
          anchor = 'The conservative board-tested SD baseline is a FAT-compatible SanDisk card of 32 GB or less.'
          note = ('Internal-storage mount, recovery-format/mount-failure, configuration-default recovery, and successful SD configuration import are recorded in the volatile System Events/dmesg history as distinct semantic events. Startup discovery is retained without interactive notification.\n\n')
          if note not in text:
              text = text.replace(anchor, note + anchor)
          path.write_text(text)

          path = Path('docs/CAPABILITIES.md')
          text = path.read_text()
          anchor = 'RFScout can operate without SD for configuration, radio/sensor use, and Audio Spectrum.'
          note = ('System Events/dmesg records internal-storage mount/recovery status and accepted configuration import/default recovery separately from SD-card mount state. ')
          if note not in text:
              text = text.replace(anchor, note + anchor)
          path.write_text(text)
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/roadmap-storage-alignment-temp.yml
          git add docs/ROADMAP.md docs/ARCHITECTURE.md docs/CAPABILITIES.md .github/workflows/roadmap-storage-alignment-temp.yml
          git commit -m "Align storage roadmap and diagnostics documentation"
          git push origin HEAD:feature/internal-config-storage
