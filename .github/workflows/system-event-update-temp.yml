name: Apply internal storage event update
on:
  push:
    branches: [feature/internal-config-storage]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/internal-config-storage
      - name: Apply event changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('main/event.h'); s=p.read_text(); s=s.replace('    RFSCOUT_EVENT_STORAGE_UNMOUNTED,\n    RFSCOUT_EVENT_APP_AVAILABLE,','    RFSCOUT_EVENT_STORAGE_UNMOUNTED,\n    RFSCOUT_EVENT_INTERNAL_STORAGE_MOUNTED,\n    RFSCOUT_EVENT_INTERNAL_STORAGE_FORMATTED,\n    RFSCOUT_EVENT_INTERNAL_STORAGE_MOUNT_FAILED,\n    RFSCOUT_EVENT_CONFIG_IMPORTED,\n    RFSCOUT_EVENT_CONFIG_DEFAULTED,\n    RFSCOUT_EVENT_APP_AVAILABLE,'); p.write_text(s)
          p=Path('main/system_events.c'); s=p.read_text(); s=s.replace('        case RFSCOUT_EVENT_STORAGE_UNMOUNTED:\n        case RFSCOUT_EVENT_APP_AVAILABLE:','        case RFSCOUT_EVENT_STORAGE_UNMOUNTED:\n        case RFSCOUT_EVENT_INTERNAL_STORAGE_MOUNTED:\n        case RFSCOUT_EVENT_INTERNAL_STORAGE_FORMATTED:\n        case RFSCOUT_EVENT_INTERNAL_STORAGE_MOUNT_FAILED:\n        case RFSCOUT_EVENT_CONFIG_IMPORTED:\n        case RFSCOUT_EVENT_CONFIG_DEFAULTED:\n        case RFSCOUT_EVENT_APP_AVAILABLE:'); s=s.replace('        RFSCOUT_EVENT_STORAGE_MOUNT_FAILED == a_event->type )','        RFSCOUT_EVENT_STORAGE_MOUNT_FAILED == a_event->type ||\n        RFSCOUT_EVENT_INTERNAL_STORAGE_MOUNT_FAILED == a_event->type )'); marker='        case RFSCOUT_EVENT_STORAGE_UNMOUNTED:\n            snprintf( a_title, a_title_size, "SD CARD" );\n            snprintf( a_detail, a_detail_size, "UNMOUNTED" );\n            break;'; repl=marker+'\n        case RFSCOUT_EVENT_INTERNAL_STORAGE_MOUNTED:\n            snprintf( a_title, a_title_size, "INTERNAL STORAGE" );\n            snprintf( a_detail, a_detail_size, "MOUNTED" );\n            break;\n        case RFSCOUT_EVENT_INTERNAL_STORAGE_FORMATTED:\n            snprintf( a_title, a_title_size, "INTERNAL STORAGE" );\n            snprintf( a_detail, a_detail_size, "FORMATTED" );\n            break;\n        case RFSCOUT_EVENT_INTERNAL_STORAGE_MOUNT_FAILED:\n            snprintf( a_title, a_title_size, "INTERNAL STORAGE" );\n            snprintf( a_detail, a_detail_size, "MOUNT FAILED" );\n            break;\n        case RFSCOUT_EVENT_CONFIG_IMPORTED:\n            snprintf( a_title, a_title_size, "CONFIG" );\n            snprintf( a_detail, a_detail_size, "IMPORTED FROM SD" );\n            break;\n        case RFSCOUT_EVENT_CONFIG_DEFAULTED:\n            snprintf( a_title, a_title_size, "CONFIG" );\n            snprintf( a_detail, a_detail_size, "DEFAULTS RESTORED" );\n            break;'; assert marker in s; p.write_text(s.replace(marker,repl))
          p=Path('main/config_store.c'); s=p.read_text().replace('#include "device_config.h"\n#include "storage.h"','#include "device_config.h"\n#include "event.h"\n#include "storage.h"'); old='''    const esp_vfs_littlefs_conf_t config = {\n        .base_path = RFSCOUT_INTERNAL_CONFIG_ROOT,\n        .partition_label = "storage",\n        .format_if_mount_failed = true,\n        .dont_mount = false,\n    };\n    const esp_err_t result = esp_vfs_littlefs_register( &config );\n    if( ESP_OK != result )\n    {\n        ESP_LOGE( TAG, "internal LittleFS mount failed: %s", esp_err_to_name( result ) );\n        return result;\n    }\n\n    available = true;'''; new='''    const esp_vfs_littlefs_conf_t config = {\n        .base_path = RFSCOUT_INTERNAL_CONFIG_ROOT,\n        .partition_label = "storage",\n        .format_if_mount_failed = false,\n        .dont_mount = false,\n    };\n    esp_err_t result = esp_vfs_littlefs_register( &config );\n    if( ESP_OK != result )\n    {\n        ESP_LOGW( TAG, "internal LittleFS mount failed; attempting format: %s", esp_err_to_name( result ) );\n        result = esp_littlefs_format( config.partition_label );\n        if( ESP_OK == result )\n        {\n            rfscout_event_emit( RFSCOUT_EVENT_INTERNAL_STORAGE_FORMATTED, RFSCOUT_EVENT_SOURCE_SYSTEM, (int32_t)ESP_OK );\n            result = esp_vfs_littlefs_register( &config );\n        }\n    }\n    if( ESP_OK != result )\n    {\n        rfscout_event_emit( RFSCOUT_EVENT_INTERNAL_STORAGE_MOUNT_FAILED, RFSCOUT_EVENT_SOURCE_SYSTEM, (int32_t)result );\n        ESP_LOGE( TAG, "internal LittleFS mount failed: %s", esp_err_to_name( result ) );\n        return result;\n    }\n\n    available = true;\n    rfscout_event_emit( RFSCOUT_EVENT_INTERNAL_STORAGE_MOUNTED, RFSCOUT_EVENT_SOURCE_SYSTEM, (int32_t)ESP_OK );'''; assert old in s; p.write_text(s.replace(old,new))
          p=Path('main/device_config.c'); s=p.read_text(); s=s.replace('#include "device_config.h"','#include "device_config.h"\n\n#include "event.h"',1) if '#include "event.h"' not in s else s; old='            else\n            {\n                config_upgrade_pending = false;\n            }'; new='            else\n            {\n                config_upgrade_pending = false;\n                if( config_store_imported() )\n                {\n                    rfscout_event_emit( RFSCOUT_EVENT_CONFIG_IMPORTED, RFSCOUT_EVENT_SOURCE_SYSTEM, (int32_t)RFSCOUT_CONFIG_SCHEMA_VERSION );\n                }\n            }'; assert old in s; s=s.replace(old,new,1); old='    return device_config_save( false, 0, NULL );\n}'; new='    const esp_err_t save_result = device_config_save( false, 0, NULL );\n    if( ESP_OK == save_result )\n    {\n        rfscout_event_emit( RFSCOUT_EVENT_CONFIG_DEFAULTED, RFSCOUT_EVENT_SOURCE_SYSTEM, (int32_t)RFSCOUT_CONFIG_SCHEMA_VERSION );\n    }\n    return save_result;\n}'; idx=s.find('internal configuration invalid; replacing with defaults'); pos=s.find(old,idx); assert pos>=0; s=s[:pos]+s[pos:].replace(old,new,1); p.write_text(s)
          PY
          python3 tools/check_format.py --all --fix
          git rm .github/workflows/system-event-update-temp.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add main/event.h main/system_events.c main/config_store.c main/device_config.c
          git commit -m "feat: report internal persistence in system events"
          git push origin HEAD:feature/internal-config-storage
