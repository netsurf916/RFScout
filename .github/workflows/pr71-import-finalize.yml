name: PR71 import finalization

on:
  push:
    branches:
      - feature/internal-config-storage
    paths:
      - .github/workflows/pr71-import-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply import transaction fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 .github/pr71_import_finalize.py
          git rm .github/pr71_import_finalize.py .github/workflows/pr71-import-finalize.yml
          git add main/config_store.c main/config_store.h main/device_config.c README.md docs/ARCHITECTURE.md docs/CAPABILITIES.md docs/CONFIGURATION.md
          git commit -m "Finalize SD config imports after canonical save"
          git push origin HEAD:feature/internal-config-storage
