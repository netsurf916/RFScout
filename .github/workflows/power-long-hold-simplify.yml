name: Simplify long-hold power action

on:
  push:
    branches:
      - feature/power-button-actions

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/power-button-actions
          fetch-depth: 0
      - name: Apply long-hold semantics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('main/power.c')
          text = p.read_text()
          text = text.replace('static bool long_action_fired;\nstatic power_action_t long_action_pending_release;\nstatic power_status_t status;\n',
                              'static bool long_action_fired;\nstatic power_status_t status;\n')
          text = text.replace('        case POWER_ACTION_SLEEP:\n            return 0 != RFSCOUT_BOARD_CAN_DEEP_SLEEP;\n',
                              '        case POWER_ACTION_SLEEP:\n            return !a_long_press && ( 0 != RFSCOUT_BOARD_CAN_DEEP_SLEEP );\n')
          text = text.replace('    long_action_pending_release = POWER_ACTION_NONE;\n', '')
          text = text.replace('        long_action_pending_release = POWER_ACTION_NONE;\n', '')
          text = text.replace('            long_action_pending_release = POWER_ACTION_NONE;\n', '')
          text = text.replace('            const power_action_t deferred_action = long_action_pending_release;\n', '')
          text = re.sub(r'\n            if\( POWER_ACTION_NONE != deferred_action \)\n            \{\n                execute_action\( deferred_action, true \);\n                return;\n            \}\n', '\n', text, count=1)
          text = re.sub(r'\n        if\( POWER_ACTION_SLEEP == long_action \)\n        \{\n            /\* The user key is also the active-low deep-sleep wake source\. Wait\n               for its debounced release so sleep cannot immediately wake itself\. \*/\n            long_action_pending_release = long_action;\n            set_power_status\( POWER_HOLD_EXECUTING, long_action, 0U, "RELEASE TO SLEEP" \);\n            return;\n        \}\n', '\n', text, count=1)
          if 'long_action_pending_release' in text or 'RELEASE TO SLEEP' in text or 'deferred_action' in text:
              raise SystemExit('long-sleep workaround was not fully removed')
          p.write_text(text)

          p = Path('main/device_config.c')
          text = p.read_text()
          old = '''    if( a_long_press )\n    {\n        return ( POWER_ACTION_NONE == a_action ) || ( POWER_ACTION_SLEEP == a_action ) ||\n               ( POWER_ACTION_POWER_OFF == a_action );\n    }\n'''
          new = '''    if( a_long_press )\n    {\n        return ( POWER_ACTION_NONE == a_action ) || ( POWER_ACTION_POWER_OFF == a_action );\n    }\n'''
          if old not in text:
              raise SystemExit('long gesture validation block not found')
          p.write_text(text.replace(old, new, 1))

          p = Path('docs/POWER.md')
          text = p.read_text()
          text = text.replace('**Long press** supports, when available on the board:\n\n- `None`\n- `Sleep`\n- `Power off`',
                              '**Long press** supports, when available on the board:\n\n- `None`\n- `Power off`')
          text = text.replace('The global power-transition overlay is parameterized by the pending action rather than being hardcoded to shutdown. A long hold therefore shows an action-specific prompt such as `HOLD TO SLEEP` or `HOLD TO POWER OFF`, followed by `SLEEPING...` or `POWERING OFF...` once the threshold is reached.',
                              'The global power-transition overlay is parameterized rather than hardcoded to shutdown. For the power button, a configured long hold shows `HOLD TO POWER OFF`, followed by `POWERING OFF...` once the threshold is reached. Sleep remains a semantic power action for short press and other device policies, but it is intentionally not exposed as a long-hold action because the same physical button is also the deep-sleep wake source.')
          text = text.replace('Board definitions advertise support for screen-off, deep sleep, and physical power-off. The menu cycles only through actions supported for that gesture on the active board. Configuration values remain semantic rather than naming PMU, GPIO, or SoC-specific mechanisms.',
                              'Board definitions advertise support for screen-off, deep sleep, and physical power-off. Gesture suitability is intentionally separate from board capability: a board may support deep sleep while the long-hold menu still excludes `Sleep`. The menu cycles only through actions both supported by the board and valid for that gesture. Configuration values remain semantic rather than naming PMU, GPIO, or SoC-specific mechanisms.')
          p.write_text(text)
          PY
          git rm .github/workflows/power-long-hold-simplify.yml
      - name: Format and commit
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18
          clang-format-18 -i main/power.c main/device_config.c
          git config user.name "RFScout CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Limit long-hold action to power off"
          git push origin HEAD:feature/power-button-actions
