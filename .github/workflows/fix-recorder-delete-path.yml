name: Fix Recorder delete path

on:
  push:
    branches:
      - codex/recorder-app
    paths:
      - .github/workflows/fix-recorder-delete-path.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/recorder-app
          fetch-depth: 0
      - name: Fix delete path buffer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('main/recorder.c')
          s = p.read_text()
          old = '    char path[ RFSCOUT_RECORDER_PATH_MAX ];'
          new = '    char path[ sizeof( RFSCOUT_RECORDER_DIRECTORY ) + RFSCOUT_RECORDER_NAME_MAX + 1U ];'
          if old not in s:
              raise SystemExit('target not found')
          p.write_text(s.replace(old, new, 1))
          PY
          python3 tools/check_format.py --fix
          git rm .github/workflows/fix-recorder-delete-path.yml
          git config user.name "Daniel Wilson"
          git config user.email "netsurf916@users.noreply.github.com"
          git add main/recorder.c
          git commit -m "Fix Recorder delete path buffer"
          git push origin HEAD:codex/recorder-app
