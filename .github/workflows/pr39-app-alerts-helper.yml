name: PR39 app notification migration helper

on:
  push:
    branches:
      - feature/semantic-events-audio-policy

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/semantic-events-audio-policy
          fetch-depth: 0
      - name: Move mapping rows out of global Device settings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('main/device_view.c')
          text = path.read_text()
          old = '''#define DEVICE_ITEM_ALERT_VOLUME 18U
          #define DEVICE_ITEM_NOTIFICATION_FIRST 19U
          #define DEVICE_ITEM_NOTIFICATION_LAST                                                              \\
              ( DEVICE_ITEM_NOTIFICATION_FIRST + RFSCOUT_NOTIFICATION_TYPE_COUNT - 1U )
          #define DEVICE_ITEM_SAVE ( DEVICE_ITEM_NOTIFICATION_LAST + 1U )
          #define DEVICE_ITEM_COUNT ( DEVICE_ITEM_SAVE + 1U )'''
          new = '''#define DEVICE_ITEM_ALERT_VOLUME 18U
          #define DEVICE_ITEM_SAVE 19U
          /* Per-detection Morse mappings are app-owned and intentionally live beyond the
             globally reachable Device-settings item range. Keep these constants only for
             compatibility with shared formatting/configuration helpers below. */
          #define DEVICE_ITEM_NOTIFICATION_FIRST 20U
          #define DEVICE_ITEM_NOTIFICATION_LAST                                                              \\
              ( DEVICE_ITEM_NOTIFICATION_FIRST + RFSCOUT_NOTIFICATION_TYPE_COUNT - 1U )
          #define DEVICE_ITEM_COUNT ( DEVICE_ITEM_SAVE + 1U )'''
          if old not in text:
              raise SystemExit('expected Device item block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Install clang-format 18
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18
      - name: Apply repository formatting
        run: python3 tools/check_format.py --all --fix
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main/device_view.c
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Move notification mappings into app settings"
          git push origin HEAD:feature/semantic-events-audio-policy
