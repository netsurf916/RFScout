name: PR41 review fixes

on:
  push:
    branches:
      - codex/refactor-nrf24-app-for-performance-improvements

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/refactor-nrf24-app-for-performance-improvements
          fetch-depth: 0
      - name: Apply review fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'expected text not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          replace('main/app_manager.c', '    nrf24_recent_packet_t packets[ NRF24_RECENT_PACKET_MAX ];\n', '')
          replace('main/app_manager.c', '    const size_t packet_count = nrf24_activity_recent_packets( packets, NRF24_RECENT_PACKET_MAX );\n', '')
          replace('main/app_manager.c', '                                   devices,\n                                   device_count,\n                                   packets,\n                                   packet_count );\n', '                                   devices,\n                                   device_count );\n')

          replace('main/radio_app_view.c', '#define NRF24_PACKET_TEXT_MAX 30U\n', '')
          replace('main/radio_app_view.c', '                                    bool a_detected,\n                                    const nrf24_fingerprint_t *a_devices,\n                                    size_t a_device_count,\n                                    const nrf24_recent_packet_t *a_packets,\n                                    size_t a_packet_count )\n', '                                    bool a_detected,\n                                    const nrf24_fingerprint_t *a_devices,\n                                    size_t a_device_count )\n')
          p = Path('main/radio_app_view.c')
          text = p.read_text()
          start = text.index('    display_draw_text( UI_LAYOUT_LEFT_X, 148, "RECENT VALID PACKETS", SUBDUED, 1U );\n')
          end = text.index('    display_draw_text( UI_LAYOUT_LEFT_X, UI_LAYOUT_FOOTER_Y, "FAST ACTIVITY / PEAK HOLD", DIM, 1U );\n', start)
          p.write_text(text[:start] + text[end:])

          replace('main/radio_app_view.h', '#include "nrf24_activity.h"\n', '#include "nrf24.h"\n')
          replace('main/radio_app_view.h', '                                    bool a_detected,\n                                    const nrf24_fingerprint_t *a_devices,\n                                    size_t a_device_count,\n                                    const nrf24_recent_packet_t *a_packets,\n                                    size_t a_packet_count );\n', '                                    bool a_detected,\n                                    const nrf24_fingerprint_t *a_devices,\n                                    size_t a_device_count );\n')

          replace('README.md', 'nRF24 scans the 2.4 GHz channel range using RPD activity, a fast-decay histogram, optional slow peak hold, and conservative passive Enhanced ShockBurst classification when a decoder supplies validated observations. The fixed **DETECTIONS** panel includes categories such as `ESB device`, `Input?`, `Sensor?`, `Logitech?`, and broader 2.4 GHz activity. The UI has a newest-first, width-bounded hexadecimal preview for those validated observations; the current RPD-only scanner does not populate it, and energy hits are never presented as decoded packets.\n', 'nRF24 scans the 2.4 GHz channel range using RPD activity, a fast-decay histogram, optional slow peak hold, and conservative passive Enhanced ShockBurst classification when a decoder supplies validated observations. The fixed **DETECTIONS** panel includes categories such as `ESB device`, `Input?`, `Sensor?`, `Logitech?`, and broader 2.4 GHz activity. The activity layer now has bounded storage for validated packet observations, but the current RPD-only scanner has no packet decoder and therefore does not expose a packet preview in the production UI.\n')
          replace('docs/CAPABILITIES.md', 'Implemented behavior includes configurable channel bounds and dwell time, fast activity history, optional slow peak hold, an ingestion API and newest-first bounded hex preview for CRC-validated Enhanced ShockBurst observations, address-based count deduplication, conservative detection categories, app-owned notifications, and `RESET COUNTS`. The current scanner produces RPD energy observations only, so packet ingestion and the preview remain dormant until receive-only ESB candidate discovery and validation are implemented.\n', 'Implemented behavior includes configurable channel bounds and dwell time, fast activity history, optional slow peak hold, an ingestion API plus bounded newest-first storage for CRC-validated Enhanced ShockBurst observations, address-based count deduplication, conservative detection categories, app-owned notifications, and `RESET COUNTS`. The current scanner produces RPD energy observations only, so no packet preview is exposed until receive-only ESB candidate discovery and validation are implemented.\n')
          replace('docs/NRF24_RESEARCH.md', 'The current radio worker performs RPD sweeps only. The validated-observation API,\nclassifier path, and recent-packet presentation are ready for a decoder producer,\nbut they intentionally remain empty until receive-only candidate discovery and\nCRC validation are implemented. This avoids turning threshold energy hits into\nplausible-looking packet data.\n', 'The current radio worker performs RPD sweeps only. The validated-observation API,\nclassifier path, and bounded recent-packet storage are ready for a decoder producer,\nbut the production UI intentionally does not expose a packet preview until receive-only\ncandidate discovery and CRC validation are implemented. This avoids turning threshold\nenergy hits into plausible-looking packet data.\n')
          replace('docs/NRF24_RESEARCH.md', '3. **Add a bounded capture ring.** The live UI intentionally shows only a short,\n   newest-first, width-truncated hex preview. A later SD capture format should\n   retain full payload, address, channel, air rate, CRC status, and monotonic time.\n', '3. **Expose the bounded capture ring once decoding is real.** The activity layer already\n   keeps a short newest-first validated-packet ring. A future UI preview must fit the\n   fixed display layout, while later SD capture should retain full payload, address,\n   channel, air rate, CRC status, and monotonic time.\n')

          Path('.github/workflows/pr41-review-fixes.yml').unlink()
          PY
      - name: Install clang-format 18
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18
      - name: Format sources
        run: python3 tools/check_format.py --all --fix
      - name: Commit review fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Address nRF24 preview review findings"
          git push origin HEAD:codex/refactor-nrf24-app-for-performance-improvements
