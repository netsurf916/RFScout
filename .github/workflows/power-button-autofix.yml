name: Power button branch autofix

on:
  push:
    branches:
      - feature/power-button-actions

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/power-button-actions
          fetch-depth: 0
      - name: Install clang-format 18
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18
      - name: Fix known syntax typo and canonicalize firmware
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('main/device_view.c')
          text = p.read_text()
          old = '''    if( (rfscout_alert_mode_t)mode != old_mode &&\n        ( ESP_OK == device_config_set_alert_mode( (rfscout_alert_mode_t)mode ) )\n    {'''
          new = '''    if( (rfscout_alert_mode_t)mode != old_mode &&\n        ( ESP_OK == device_config_set_alert_mode( (rfscout_alert_mode_t)mode ) ) )\n    {'''
          if old not in text:
              raise SystemExit('expected syntax target not found')
          p.write_text(text.replace(old, new, 1))
          PY
          RFSCOUT_CLANG_FORMAT=clang-format-18 python3 tools/check_format.py --all --fix
      - name: Commit canonical result
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "RFScout CI"
          git config user.email "actions@users.noreply.github.com"
          git add main
          git commit -m "Canonicalize power button implementation"
          git push origin HEAD:feature/power-button-actions
