name: Refresh IEEE OUI database

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-oui.yml'
      - 'tools/update_oui.py'
      - 'tools/update_surveillance.py'
      - 'data/surveillance_signatures.csv'
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Generate current IEEE prefix tables
        run: python3 tools/update_oui.py
      - name: Validate and generate curated surveillance signatures
        run: python3 tools/update_surveillance.py
      - name: Commit registry and signature changes
        run: |
          GENERATED_DIR=main/services/wireless
          if git diff --quiet -- "$GENERATED_DIR/oui_database.inc" "$GENERATED_DIR/oui_database_extended.inc" "$GENERATED_DIR/surveillance_signatures.inc" data/surveillance_oui_validation.csv; then
            echo "OUI and surveillance databases already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$GENERATED_DIR/oui_database.inc" "$GENERATED_DIR/oui_database_extended.inc" "$GENERATED_DIR/surveillance_signatures.inc" data/surveillance_oui_validation.csv
          git commit -m "Refresh IEEE OUI and surveillance validation"
          git push
