name: Refresh IEEE OUI database

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate current IEEE MA-L table
        run: python3 tools/update_oui.py
      - name: Validate and generate curated surveillance signatures
        run: python3 tools/update_surveillance.py
      - name: Commit registry and signature changes
        run: |
          if git diff --quiet -- main/oui_database.inc main/surveillance_signatures.inc data/surveillance_oui_validation.csv; then
            echo "OUI and surveillance databases already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main/oui_database.inc main/surveillance_signatures.inc data/surveillance_oui_validation.csv
          git commit -m "Refresh IEEE OUI and surveillance validation"
          git push
