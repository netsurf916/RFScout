name: Refresh IEEE OUI database

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate current IEEE MA-L table
        run: python3 tools/update_oui.py
      - name: Commit registry changes
        run: |
          if git diff --quiet -- main/oui_database.inc; then
            echo "OUI database already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main/oui_database.inc
          git commit -m "Refresh IEEE OUI database"
          git push
