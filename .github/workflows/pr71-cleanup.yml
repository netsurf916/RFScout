name: PR71 cleanup
on:
  push:
    branches:
      - feature/internal-config-storage
    paths:
      - .github/workflows/pr71-cleanup.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 .github/pr71_cleanup.py
          git rm .github/pr71_cleanup.py .github/workflows/pr71-cleanup.yml
          git add main/device_config.c
          git commit -m "Remove obsolete config upgrade state"
          git push origin HEAD:feature/internal-config-storage
