name: Format display idle source tree

on:
  push:
    branches:
      - display-idle-dim-off
    paths:
      - .github/workflows/format-display-idle-all.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: display-idle-dim-off
          fetch-depth: 0
      - name: Install clang-format 18
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18
      - name: Format complete C tree
        run: python3 tools/check_format.py --all --fix
      - name: Remove helper and commit formatting
        run: |
          rm .github/workflows/format-display-idle-all.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format display idle source changes"
          git push origin HEAD:display-idle-dim-off
