name: Finalize audio split

on:
  push:
    branches:
      - refactor/app-runtime-dispatch

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.head_commit.message == 'Apply final Audio Spectrum integration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/app-runtime-dispatch
          fetch-depth: 0
      - name: Apply exact integration edits
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          replace("main/apps/recorder/app.c",
                  ".services = RFSCOUT_APP_SERVICE_RECORDER,",
                  ".services = RFSCOUT_APP_SERVICE_AUDIO_CAPTURE,")

          replace("main/app_session.c", '#include "audio_spectrum.h"\n', "")
          replace("main/app_session.c",
                  "    recorder_stop();\n    audio_spectrum_stop();\n",
                  "    recorder_stop();\n")
          replace("main/app_session.c",
                  ".capability = RFSCOUT_APP_SERVICE_RECORDER,\n        .name = \"Recorder\",",
                  ".capability = RFSCOUT_APP_SERVICE_AUDIO_CAPTURE,\n        .name = \"Audio capture\",")

          p = Path("main/apps/home/device_view.c")
          text = p.read_text()
          text = text.replace("#define DEVICE_ITEM_THERMAL 23U\n#define DEVICE_ITEM_LOGGING 24U\n#define DEVICE_ITEM_POWER_BUTTON 25U\n#define DEVICE_ITEM_POWER_POLICY 26U\n#define DEVICE_ITEM_SAVE 27U\n#define DEVICE_ITEM_NOTIFICATION_FIRST 28U",
                              "#define DEVICE_ITEM_THERMAL 23U\n#define DEVICE_ITEM_AUDIO_SPECTRUM 24U\n#define DEVICE_ITEM_LOGGING 25U\n#define DEVICE_ITEM_POWER_BUTTON 26U\n#define DEVICE_ITEM_POWER_POLICY 27U\n#define DEVICE_ITEM_SAVE 28U\n#define DEVICE_ITEM_NOTIFICATION_FIRST 29U")
          text = text.replace('        case RFSCOUT_APP_THERMAL:\n            return "Thermal";\n',
                              '        case RFSCOUT_APP_THERMAL:\n            return "Thermal";\n        case RFSCOUT_APP_AUDIO_SPECTRUM:\n            return "Audio Spectrum";\n', 1)
          text = text.replace('( DEVICE_ITEM_THERMAL == a_item ) || ( DEVICE_ITEM_LOGGING == a_item );',
                              '( DEVICE_ITEM_THERMAL == a_item ) || ( DEVICE_ITEM_AUDIO_SPECTRUM == a_item ) ||\n           ( DEVICE_ITEM_LOGGING == a_item );')
          text = text.replace('        case DEVICE_ITEM_THERMAL:\n            return "Thermal";\n        case DEVICE_ITEM_LOGGING:',
                              '        case DEVICE_ITEM_THERMAL:\n            return "Thermal";\n        case DEVICE_ITEM_AUDIO_SPECTRUM:\n            return "Audio Spectrum";\n        case DEVICE_ITEM_LOGGING:')
          text = text.replace('        case DEVICE_ITEM_THERMAL:\n            snprintf(\n                a_value, a_capacity, "%s", on_off( config->apps_enabled[ RFSCOUT_APP_THERMAL ] ) );\n            break;\n        case DEVICE_ITEM_LOGGING:',
                              '        case DEVICE_ITEM_THERMAL:\n            snprintf(\n                a_value, a_capacity, "%s", on_off( config->apps_enabled[ RFSCOUT_APP_THERMAL ] ) );\n            break;\n        case DEVICE_ITEM_AUDIO_SPECTRUM:\n            snprintf( a_value,\n                      a_capacity,\n                      "%s",\n                      on_off( config->apps_enabled[ RFSCOUT_APP_AUDIO_SPECTRUM ] ) );\n            break;\n        case DEVICE_ITEM_LOGGING:')
          text = text.replace('    else if( DEVICE_ITEM_THERMAL == selected_item )\n    {\n        toggle_app( RFSCOUT_APP_THERMAL, "apps.thermal" );\n    }\n    else if( DEVICE_ITEM_LOGGING == selected_item )',
                              '    else if( DEVICE_ITEM_THERMAL == selected_item )\n    {\n        toggle_app( RFSCOUT_APP_THERMAL, "apps.thermal" );\n    }\n    else if( DEVICE_ITEM_AUDIO_SPECTRUM == selected_item )\n    {\n        toggle_app( RFSCOUT_APP_AUDIO_SPECTRUM, "apps.audio_spectrum" );\n    }\n    else if( DEVICE_ITEM_LOGGING == selected_item )')
          p.write_text(text)

          p = Path("main/apps/system_events/system_events_view.c")
          text = p.read_text()
          text = text.replace('        case RFSCOUT_APP_THERMAL:\n            return "THM";\n        case RFSCOUT_APP_COUNT:',
                              '        case RFSCOUT_APP_THERMAL:\n            return "THM";\n        case RFSCOUT_APP_AUDIO_SPECTRUM:\n            return "SPC";\n        case RFSCOUT_APP_COUNT:')
          p.write_text(text)
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finish Audio Spectrum app integration"
          git push origin HEAD:refactor/app-runtime-dispatch
