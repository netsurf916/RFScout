name: PR47 quiesce rollback fix

on:
  push:
    branches:
      - stabilize-app-lifecycle-ui

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: stabilize-app-lifecycle-ui
      - name: Restore acquisition when quiesce times out
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('main/cc1101.c'): (
                  '''    if( worker_active )\n    {\n        ESP_LOGE(\n            TAG, "scan worker did not quiesce within %u ms", (unsigned)CC1101_STOP_TIMEOUT_MS );\n        return false;\n    }''',
                  '''    if( worker_active )\n    {\n        running = true;\n        ESP_LOGE(\n            TAG, "scan worker did not quiesce within %u ms; resuming scan",\n            (unsigned)CC1101_STOP_TIMEOUT_MS );\n        return false;\n    }'''),
              Path('main/nrf24.c'): (
                  '''    if( worker_active )\n    {\n        ESP_LOGE(\n            TAG, "scan worker did not quiesce within %u ms", (unsigned)NRF24_STOP_TIMEOUT_MS );\n        return false;\n    }''',
                  '''    if( worker_active )\n    {\n        running = true;\n        ESP_LOGE(\n            TAG, "scan worker did not quiesce within %u ms; resuming scan",\n            (unsigned)NRF24_STOP_TIMEOUT_MS );\n        return false;\n    }'''),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'expected stop timeout block not found in {path}')
              path.write_text(text.replace(old, new, 1))
          PY
      - name: Install clang-format 18
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18
      - name: Format, commit, and remove helper workflow
        run: |
          clang-format-18 -i main/cc1101.c main/nrf24.c
          rm .github/workflows/pr47-quiesce-rollback-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main/cc1101.c main/nrf24.c .github/workflows/pr47-quiesce-rollback-fix.yml
          git commit -m "Restore radio activity after failed quiesce"
          git push origin HEAD:stabilize-app-lifecycle-ui
