name: Build and formatting

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install clang-format 18
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18

      - name: Check complete C formatting
        run: python3 tools/check_format.py --all

  build:
    name: ESP-IDF Build
    runs-on: ubuntu-latest
    container: espressif/idf:release-v6.1

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build ESP32-S3 firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py --version
          idf.py -DRFSCOUT_FORMAT_CHECK=OFF set-target esp32s3
          idf.py -DRFSCOUT_FORMAT_CHECK=OFF build
