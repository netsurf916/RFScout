name: Build and formatting

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Install clang-format 18
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18

      - name: Canonicalize complete C formatting
        run: |
          python3 tools/check_format.py --all --fix
          python3 tools/check_format.py --all

      - name: Commit canonical formatting
        shell: bash
        run: |
          if git diff --quiet -- main; then
            echo "Firmware tree is already canonical."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main
          git commit -m "Canonicalize Device settings sources"
          git push origin "HEAD:${{ github.head_ref }}"

  build:
    name: ESP-IDF Build
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.5

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build ESP32-S3 firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -DRFSCOUT_FORMAT_CHECK=OFF set-target esp32s3
          idf.py -DRFSCOUT_FORMAT_CHECK=OFF build
