name: Build and formatting

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: rfscout-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  formatting:
    name: Formatting and packaging tests
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install clang-format 18
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18

      - name: Check complete C formatting
        run: python3 tools/check_format.py --all

      - name: Test release packager
        run: python3 -m unittest discover -s tests -p 'test_*.py'

  build:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    name: ESP-IDF Build and candidate bundle
    runs-on: ubuntu-latest
    container: espressif/idf:release-v6.1

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build ESP32-S3 firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py --version
          idf.py -DRFSCOUT_FORMAT_CHECK=OFF set-target esp32s3
          idf.py -DRFSCOUT_FORMAT_CHECK=OFF build

      - name: Package candidate firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf_version=$(idf.py --version)
          version="candidate-${GITHUB_SHA:0:12}"
          idf.py -DRFSCOUT_FORMAT_CHECK=OFF merge-bin -o rfscout-full.bin -f raw
          python3 tools/package_release.py \
            --build-dir build \
            --merged-image build/rfscout-full.bin \
            --output-dir dist \
            --version "$version" \
            --commit "$GITHUB_SHA" \
            --idf-version "$idf_version"

      - name: Upload candidate firmware
        uses: actions/upload-artifact@v7
        with:
          name: rfscout-candidate-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14
