name: Audio split integration

on:
  push:
    branches:
      - refactor/app-runtime-dispatch

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.head_commit.message == 'Apply audio split integration patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/app-runtime-dispatch
          fetch-depth: 0
      - name: Apply integration edits
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          replace(
              "main/device_config.c",
              '        [RFSCOUT_APP_THERMAL] = "thermal",\n',
              '        [RFSCOUT_APP_THERMAL] = "thermal",\n'
              '        [RFSCOUT_APP_AUDIO_SPECTRUM] = "audio_spectrum",\n',
          )

          replace(
              "main/services/audio/recorder.c",
              '    if( RFSCOUT_RECORDER_IDLE != recorder_state() )\n        return ESP_ERR_INVALID_STATE;\n'
              '    recorder_set_input_gain_db( a_gain_db );',
              '    const rfscout_recorder_state_t current = recorder_state();\n'
              '    if( ( RFSCOUT_RECORDER_IDLE != current ) &&\n'
              '        ( RFSCOUT_RECORDER_NO_STORAGE != current ) )\n'
              '        return ESP_ERR_INVALID_STATE;\n'
              '    recorder_set_input_gain_db( a_gain_db );',
          )
          replace(
              "main/services/audio/recorder.c",
              '    if( a_gain_db > 24U )\n        a_gain_db = 24U;',
              '    if( a_gain_db > 48U )\n        a_gain_db = 48U;',
          )
          replace(
              "main/services/audio/recorder.c",
              '    recorder.c : RFScout SD-backed audio recorder implementation\n'
              '    Description: Captures PDM microphone audio to validated PCM WAV files and manages playback entries.',
              '    services/audio/recorder.c : RFScout shared microphone, recorder, and playback service\n'
              '    Description: Owns microphone capture/FFT plus SD-backed WAV recording and playback.',
          )
          replace(
              "main/services/audio/recorder.h",
              '    recorder.h : RFScout SD-backed audio recorder interface\n'
              '    Description: Records microphone PCM to WAV files and enumerates playable recordings.',
              '    services/audio/recorder.h : RFScout shared microphone, recorder, and playback service\n'
              '    Description: Exposes microphone monitoring plus SD-backed WAV recording and playback.',
          )

          cmake = Path("main/CMakeLists.txt")
          text = cmake.read_text()
          for dead in (
              '        "apps/recorder/audio_spectrum.c"\n',
              '        "apps/recorder/audio_view.c"\n',
          ):
              text = text.replace(dead, "")
          text = text.replace(
              '        "apps/recorder/recorder.c"\n',
              '        "services/audio/recorder.c"\n',
          )
          cmake.write_text(text)

          for dead in (
              "main/apps/recorder/audio_spectrum.c",
              "main/apps/recorder/audio_spectrum.h",
              "main/apps/recorder/audio_view.c",
              "main/apps/recorder/audio_view.h",
          ):
              Path(dead).unlink(missing_ok=True)
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finish Audio Spectrum service split"
          git push origin HEAD:refactor/app-runtime-dispatch
