name: PR48 fix nRF24 probe powerdown

on: [push]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: detect-radio-hardware-apps
      - name: Ensure startup probe powers down nRF24
        run: >-
          python3 -c 'from pathlib import Path; p=Path("main/nrf24.c"); s=p.read_text(); old="    detected =\n        ( setup_aw >= 1U ) && ( setup_aw <= 3U ) && ( rf_channel <= 125U ) && ( 0xFFU != status );\n    ESP_LOGI( TAG,"; new="    detected =\n        ( setup_aw >= 1U ) && ( setup_aw <= 3U ) && ( rf_channel <= 125U ) && ( 0xFFU != status );\n\n    /* A warm reset can leave an externally powered nRF24 in standby.\n       Availability probing must always return the transceiver to an\n       inactive state and must not imply acquisition. */\n    ce( false );\n    (void)write_register( NRF24_REG_CONFIG, 0x00U );\n\n    ESP_LOGI( TAG,"; assert old in s; p.write_text(s.replace(old,new,1))'
      - name: Format and commit
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18
          clang-format-18 -i main/nrf24.c
          git config user.name "Daniel Wilson"
          git config user.email "netsurf916@users.noreply.github.com"
          git add main/nrf24.c
          git commit -m "Power down nRF24 after startup probe"
          git push origin HEAD:detect-radio-hardware-apps
