name: Temporary format fix

on:
  push:
    branches:
      - feature/internal-config-storage

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/internal-config-storage
      - name: Install clang-format 18
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18
      - name: Apply canonical formatting
        run: python3 tools/check_format.py --all --fix
      - name: Commit formatter changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main/config_store.c main/device_config.c
          git commit -m "Apply canonical formatting to persistence changes"
          git push origin HEAD:feature/internal-config-storage
