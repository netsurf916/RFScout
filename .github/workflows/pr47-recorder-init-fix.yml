name: PR47 recorder init fix

on:
  push:
    branches:
      - stabilize-app-lifecycle-ui

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore lightweight recorder initialization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('main/app_manager.c')
          text = path.read_text()
          old = '''        case RFSCOUT_APP_AUDIO:\n            audio_item = AUDIO_BROWSER_BACK;\n            audio_menu = false;\n            audio_edit = false;\n            audio_last_state = RFSCOUT_RECORDER_IDLE;\n            render_audio();\n            break;\n'''
          new = '''        case RFSCOUT_APP_AUDIO:\n            audio_item = AUDIO_BROWSER_BACK;\n            audio_menu = false;\n            audio_edit = false;\n            audio_last_state = RFSCOUT_RECORDER_IDLE;\n            if( ESP_OK != recorder_init() )\n            {\n                ESP_LOGW( TAG, "Recorder initialization unavailable" );\n            }\n            render_audio();\n            break;\n'''
          if old not in text:
              raise SystemExit('expected audio entry block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Install clang-format 18
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18
      - name: Format and commit
        run: |
          clang-format-18 -i main/app_manager.c
          rm .github/workflows/pr47-recorder-init-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add main/app_manager.c .github/workflows/pr47-recorder-init-fix.yml
          git commit -m "Restore lightweight Recorder initialization"
          git push
