name: PR71 final tidy
on:
  push:
    branches:
      - feature/internal-config-storage
    paths:
      - .github/workflows/pr71-final-tidy.yml
permissions:
  contents: write
jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply final tidy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 .github/pr71-final-tidy.py
          git rm .github/pr71-final-tidy.py .github/workflows/pr71-final-tidy.yml
          git add main/device_config.c docs/CONFIGURATION.md
          git commit -m "Tighten strict config handling and docs"
          git push origin HEAD:feature/internal-config-storage
