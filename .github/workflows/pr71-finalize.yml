name: PR71 final cleanup

on:
  push:
    branches:
      - feature/internal-config-storage
    paths:
      - .github/workflows/pr71-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply targeted cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show b26c077e208c9187e11e2f9e49a34f002e03b44e:docs/ROADMAP.md > /tmp/roadmap-base.md
          python3 .github/pr71_finalize.py
          git rm .github/workflows/pr71-finalize.yml .github/pr71_finalize.py
          git add main/device_config.c docs/CONFIGURATION.md docs/ROADMAP.md
          git commit -m "Align config example sync and roadmap planning"
          git push origin HEAD:feature/internal-config-storage
