name: Add short-press power off

on:
  push:
    branches:
      - feature/power-button-actions

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/power-button-actions
          fetch-depth: 0
      - name: Add short-press power-off semantics
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('main/power.c')
          text = p.read_text()
          old = '''        case POWER_ACTION_POWER_OFF:\n            return a_long_press && ( 0 != RFSCOUT_BOARD_CAN_POWER_OFF );\n'''
          new = '''        case POWER_ACTION_POWER_OFF:\n            return 0 != RFSCOUT_BOARD_CAN_POWER_OFF;\n'''
          if old not in text:
              raise SystemExit('power-off capability block not found')
          p.write_text(text.replace(old, new, 1))

          p = Path('main/device_config.c')
          text = p.read_text()
          old = '''    return ( POWER_ACTION_NONE == a_action ) || ( POWER_ACTION_SCREEN_OFF == a_action ) ||\n           ( POWER_ACTION_SLEEP == a_action );\n'''
          new = '''    return ( POWER_ACTION_NONE == a_action ) || ( POWER_ACTION_SCREEN_OFF == a_action ) ||\n           ( POWER_ACTION_SLEEP == a_action ) || ( POWER_ACTION_POWER_OFF == a_action );\n'''
          if old not in text:
              raise SystemExit('short gesture validation block not found')
          p.write_text(text.replace(old, new, 1))

          p = Path('docs/POWER.md')
          text = p.read_text()
          text = text.replace('**Short press** supports, when available on the board:\n\n- `None`\n- `Screen off`\n- `Sleep`',
                              '**Short press** supports, when available on the board:\n\n- `None`\n- `Screen off`\n- `Sleep`\n- `Power off`')
          text = text.replace('Sleep remains a semantic power action for short press and other device policies, but it is intentionally not exposed as a long-hold action because the same physical button is also the deep-sleep wake source.',
                              'Sleep remains a semantic power action for short press and other device policies, but it is intentionally not exposed as a long-hold action because the same physical button is also the deep-sleep wake source. Power off may be assigned to either gesture; a short press provides an intentionally fast shutdown path on boards whose power button is sufficiently deliberate to operate.')
          p.write_text(text)
          PY
          git rm .github/workflows/power-short-off.yml
      - name: Format and commit
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18
          clang-format-18 -i main/power.c main/device_config.c
          git config user.name "RFScout CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Allow power off on short button press"
          git push origin HEAD:feature/power-button-actions
