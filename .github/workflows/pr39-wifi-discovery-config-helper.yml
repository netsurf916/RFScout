name: PR39 WiFi discovery preference helper

on:
  push:
    branches:
      - feature/semantic-events-audio-policy

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/semantic-events-audio-policy
          fetch-depth: 0
      - name: Add WiFi and BLE discovery sound preferences
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'expected text not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          # Canonical configuration fields and API.
          replace('main/device_config.h',
                  '    bool notification_app_enabled[ RFSCOUT_APP_COUNT ];\n    char notification_characters[ RFSCOUT_NOTIFICATION_TYPE_COUNT ];\n',
                  '    bool notification_app_enabled[ RFSCOUT_APP_COUNT ];\n    bool wifi_device_feedback_enabled;\n    bool ble_device_feedback_enabled;\n    char notification_characters[ RFSCOUT_NOTIFICATION_TYPE_COUNT ];\n')
          replace('main/device_config.h',
                  'esp_err_t device_config_set_notification_app_enabled( rfscout_app_id_t a_app, bool a_enabled );\n\n/** @brief Return the configured Morse character for one notification category. */\n',
                  'esp_err_t device_config_set_notification_app_enabled( rfscout_app_id_t a_app, bool a_enabled );\n\n/** @brief Return whether ordinary Wi-Fi discoveries may emit the general detection event. */\nbool device_config_wifi_device_feedback_enabled( void );\n/** @brief Change whether ordinary Wi-Fi discoveries may emit the general detection event. */\nesp_err_t device_config_set_wifi_device_feedback_enabled( bool a_enabled );\n/** @brief Return whether ordinary BLE discoveries may emit the general detection event. */\nbool device_config_ble_device_feedback_enabled( void );\n/** @brief Change whether ordinary BLE discoveries may emit the general detection event. */\nesp_err_t device_config_set_ble_device_feedback_enabled( bool a_enabled );\n\n/** @brief Return the configured Morse character for one notification category. */\n')

          replace('main/device_config.c',
                  '    config.recorder_input_gain_db = CONFIG_RECORDER_INPUT_GAIN_DEFAULT_DB;\n\n    for( size_t index = 0; index < RFSCOUT_APP_COUNT; ++index )\n',
                  '    config.recorder_input_gain_db = CONFIG_RECORDER_INPUT_GAIN_DEFAULT_DB;\n    config.wifi_device_feedback_enabled = true;\n    config.ble_device_feedback_enabled = true;\n\n    for( size_t index = 0; index < RFSCOUT_APP_COUNT; ++index )\n')
          replace('main/device_config.c',
                  '        config.notification_app_enabled[ index ] =\n            json_bool( notifications, "enabled", config.notification_app_enabled[ index ] );\n        const cJSON *characters = cJSON_GetObjectItemCaseSensitive( notifications, "characters" );\n',
                  '        config.notification_app_enabled[ index ] =\n            json_bool( notifications, "enabled", config.notification_app_enabled[ index ] );\n        if( RFSCOUT_APP_WIFI_BT == app )\n        {\n            const cJSON *events = cJSON_GetObjectItemCaseSensitive( notifications, "events" );\n            if( cJSON_IsObject( events ) )\n            {\n                config.wifi_device_feedback_enabled =\n                    json_bool( events, "wifi_device", config.wifi_device_feedback_enabled );\n                config.ble_device_feedback_enabled =\n                    json_bool( events, "ble_device", config.ble_device_feedback_enabled );\n            }\n        }\n        const cJSON *characters = cJSON_GetObjectItemCaseSensitive( notifications, "characters" );\n')
          replace('main/device_config.c',
                  '            cJSON_AddBoolToObject(\n                notifications, "enabled", config.notification_app_enabled[ index ] );\n            cJSON *characters = cJSON_AddObjectToObject( notifications, "characters" );\n',
                  '            cJSON_AddBoolToObject(\n                notifications, "enabled", config.notification_app_enabled[ index ] );\n            if( RFSCOUT_APP_WIFI_BT == app )\n            {\n                cJSON *events = cJSON_AddObjectToObject( notifications, "events" );\n                cJSON_AddBoolToObject(\n                    events, "wifi_device", config.wifi_device_feedback_enabled );\n                cJSON_AddBoolToObject(\n                    events, "ble_device", config.ble_device_feedback_enabled );\n            }\n            cJSON *characters = cJSON_AddObjectToObject( notifications, "characters" );\n')
          marker = 'esp_err_t device_config_set_logging_enabled( bool a_enabled )\n'
          addition = '''bool device_config_wifi_device_feedback_enabled( void )
          {
              return config.wifi_device_feedback_enabled;
          }

          esp_err_t device_config_set_wifi_device_feedback_enabled( bool a_enabled )
          {
              if( config.wifi_device_feedback_enabled != a_enabled )
              {
                  config.wifi_device_feedback_enabled = a_enabled;
                  config_dirty = true;
              }
              return ESP_OK;
          }

          bool device_config_ble_device_feedback_enabled( void )
          {
              return config.ble_device_feedback_enabled;
          }

          esp_err_t device_config_set_ble_device_feedback_enabled( bool a_enabled )
          {
              if( config.ble_device_feedback_enabled != a_enabled )
              {
                  config.ble_device_feedback_enabled = a_enabled;
                  config_dirty = true;
              }
              return ESP_OK;
          }

          esp_err_t device_config_set_logging_enabled( bool a_enabled )
          '''
          replace('main/device_config.c', marker, addition)

          # App-level notification preference facade.
          replace('main/notification_preferences.h',
                  '#include <stdbool.h>\n\n/** @brief Initialize the notification preference facade after device configuration setup. */\n',
                  '#include <stdbool.h>\n\ntypedef enum\n{\n    RFSCOUT_WIFI_DETECTION_WIFI_DEVICE = 0,\n    RFSCOUT_WIFI_DETECTION_BLE_DEVICE,\n    RFSCOUT_WIFI_DETECTION_COUNT,\n} rfscout_wifi_detection_event_t;\n\n/** @brief Initialize the notification preference facade after device configuration setup. */\n')
          replace('main/notification_preferences.h',
                  'esp_err_t notification_preferences_set_app_enabled( rfscout_app_id_t a_app, bool a_enabled );\n\n#endif // _RFSCOUT_NOTIFICATION_PREFERENCES_H_\n',
                  'esp_err_t notification_preferences_set_app_enabled( rfscout_app_id_t a_app, bool a_enabled );\n\n/** @brief Return whether one ordinary WiFi/BT discovery event may produce general feedback. */\nbool notification_preferences_wifi_detection_enabled( rfscout_wifi_detection_event_t a_event );\n\n/** @brief Change whether one ordinary WiFi/BT discovery event may produce general feedback. */\nesp_err_t notification_preferences_set_wifi_detection_enabled(\n    rfscout_wifi_detection_event_t a_event, bool a_enabled );\n\n#endif // _RFSCOUT_NOTIFICATION_PREFERENCES_H_\n')
          replace('main/notification_preferences.c',
                  'esp_err_t notification_preferences_set_app_enabled( rfscout_app_id_t a_app, bool a_enabled )\n{\n    return device_config_set_notification_app_enabled( a_app, a_enabled );\n}\n',
                  'esp_err_t notification_preferences_set_app_enabled( rfscout_app_id_t a_app, bool a_enabled )\n{\n    return device_config_set_notification_app_enabled( a_app, a_enabled );\n}\n\nbool notification_preferences_wifi_detection_enabled( rfscout_wifi_detection_event_t a_event )\n{\n    switch( a_event )\n    {\n        case RFSCOUT_WIFI_DETECTION_WIFI_DEVICE:\n            return device_config_wifi_device_feedback_enabled();\n        case RFSCOUT_WIFI_DETECTION_BLE_DEVICE:\n            return device_config_ble_device_feedback_enabled();\n        case RFSCOUT_WIFI_DETECTION_COUNT:\n        default:\n            return false;\n    }\n}\n\nesp_err_t notification_preferences_set_wifi_detection_enabled(\n    rfscout_wifi_detection_event_t a_event, bool a_enabled )\n{\n    switch( a_event )\n    {\n        case RFSCOUT_WIFI_DETECTION_WIFI_DEVICE:\n            return device_config_set_wifi_device_feedback_enabled( a_enabled );\n        case RFSCOUT_WIFI_DETECTION_BLE_DEVICE:\n            return device_config_set_ble_device_feedback_enabled( a_enabled );\n        case RFSCOUT_WIFI_DETECTION_COUNT:\n        default:\n            return ESP_ERR_INVALID_ARG;\n    }\n}\n')

          # WiFi/BT notification page gains two general-discovery switches before Morse mappings.
          replace('main/notification_settings_view.c',
                  '#define NOTIFICATION_SETTINGS_ENABLED 1U\n',
                  '#define NOTIFICATION_SETTINGS_ENABLED 1U\n#define NOTIFICATION_SETTINGS_WIFI_EVENT_COUNT 2U\n\nstatic unsigned mapping_base( rfscout_app_id_t a_app )\n{\n    return NOTIFICATION_SETTINGS_FIXED_ITEMS +\n           ( ( RFSCOUT_APP_WIFI_BT == a_app ) ? NOTIFICATION_SETTINGS_WIFI_EVENT_COUNT : 0U );\n}\n')
          replace('main/notification_settings_view.c',
                  '    const size_t notification_count = notification_count_for_app( a_app );\n    const unsigned item_count = NOTIFICATION_SETTINGS_FIXED_ITEMS + (unsigned)notification_count;\n',
                  '    const size_t notification_count = notification_count_for_app( a_app );\n    const unsigned first_mapping = mapping_base( a_app );\n    const unsigned item_count = first_mapping + (unsigned)notification_count;\n')
          replace('main/notification_settings_view.c',
                  '        const rfscout_notification_descriptor_t *descriptor =\n            notification_descriptor_for_app( a_app, item - NOTIFICATION_SETTINGS_FIXED_ITEMS );\n',
                  '        if( ( RFSCOUT_APP_WIFI_BT == a_app ) &&\n            ( item >= NOTIFICATION_SETTINGS_FIXED_ITEMS ) && ( item < first_mapping ) )\n        {\n            const rfscout_wifi_detection_event_t event =\n                (rfscout_wifi_detection_event_t)( item - NOTIFICATION_SETTINGS_FIXED_ITEMS );\n            const char *label = ( RFSCOUT_WIFI_DETECTION_WIFI_DEVICE == event )\n                                    ? "WIFI DEVICES"\n                                    : "BLE DEVICES";\n            display_draw_text( UI_LAYOUT_LABEL_X, y, label, foreground, 1U );\n            display_draw_text(\n                232,\n                y,\n                notification_preferences_wifi_detection_enabled( event ) ? "ON" : "OFF",\n                active ? theme->selected : theme->secondary,\n                1U );\n            continue;\n        }\n\n        const rfscout_notification_descriptor_t *descriptor =\n            notification_descriptor_for_app( a_app, item - first_mapping );\n')

          # Notification input understands the two non-Morse WiFi/BT rows.
          replace('main/app_manager.c',
                  '#define NOTIFICATION_MENU_FIRST_MAPPING 2U\n',
                  '#define NOTIFICATION_MENU_FIRST_MAPPING 2U\n#define NOTIFICATION_MENU_WIFI_EVENT_COUNT 2U\n')
          insert_after = '''static void open_notification_menu( void )
          {
          '''
          helper = '''static unsigned notification_mapping_base( void )
          {
              return NOTIFICATION_MENU_FIRST_MAPPING +
                     ( ( RFSCOUT_APP_WIFI_BT == active_app ) ? NOTIFICATION_MENU_WIFI_EVENT_COUNT : 0U );
          }

          static void open_notification_menu( void )
          {
          '''
          replace('main/app_manager.c', insert_after, helper)
          replace('main/app_manager.c',
                  '    const size_t notification_count = notification_count_for_app( active_app );\n    const unsigned item_count = NOTIFICATION_MENU_FIRST_MAPPING + (unsigned)notification_count;\n    if( item_count <= NOTIFICATION_MENU_FIRST_MAPPING )\n',
                  '    const size_t notification_count = notification_count_for_app( active_app );\n    const unsigned first_mapping = notification_mapping_base();\n    const unsigned item_count = first_mapping + (unsigned)notification_count;\n    if( item_count <= first_mapping )\n')
          replace('main/app_manager.c',
                  '        notification_edit = true;\n        notification_settings_view_render( active_app, notification_item, true );\n        emit_event( RFSCOUT_EVENT_ENTER, 0 );\n        return;\n',
                  '        if( ( RFSCOUT_APP_WIFI_BT == active_app ) &&\n            ( notification_item >= NOTIFICATION_MENU_FIRST_MAPPING ) &&\n            ( notification_item < first_mapping ) )\n        {\n            const rfscout_wifi_detection_event_t event =\n                (rfscout_wifi_detection_event_t)( notification_item -\n                                                   NOTIFICATION_MENU_FIRST_MAPPING );\n            const bool old_value = notification_preferences_wifi_detection_enabled( event );\n            if( ESP_OK ==\n                notification_preferences_set_wifi_detection_enabled( event, !old_value ) )\n            {\n                notification_settings_view_render( active_app, notification_item, false );\n                emit_event( !old_value ? RFSCOUT_EVENT_ENABLE : RFSCOUT_EVENT_DISABLE,\n                            !old_value ? 1 : 0 );\n            }\n            return;\n        }\n        notification_edit = true;\n        notification_settings_view_render( active_app, notification_item, true );\n        emit_event( RFSCOUT_EVENT_ENTER, 0 );\n        return;\n')
          replace('main/app_manager.c',
                  '        if( notification_item < NOTIFICATION_MENU_FIRST_MAPPING )\n        {\n            return;\n        }\n        const rfscout_notification_descriptor_t *descriptor = notification_descriptor_for_app(\n            active_app, notification_item - NOTIFICATION_MENU_FIRST_MAPPING );\n',
                  '        if( notification_item < first_mapping )\n        {\n            return;\n        }\n        const rfscout_notification_descriptor_t *descriptor =\n            notification_descriptor_for_app( active_app, notification_item - first_mapping );\n')

          # Ordinary WiFi/BLE discovery events are emitted only when both the app gate and source toggle allow them.
          replace('main/rfscout.c',
                  '    rfscout_event_emit(\n        RFSCOUT_EVENT_DETECTED, (uint8_t)RFSCOUT_APP_WIFI_BT, (int32_t)a_observation->last_source );\n',
                  '    const rfscout_wifi_detection_event_t detection_event =\n        ( RF_SOURCE_BLE == a_observation->last_source ) ? RFSCOUT_WIFI_DETECTION_BLE_DEVICE\n                                                        : RFSCOUT_WIFI_DETECTION_WIFI_DEVICE;\n    if( notification_preferences_app_enabled( RFSCOUT_APP_WIFI_BT ) &&\n        notification_preferences_wifi_detection_enabled( detection_event ) )\n    {\n        rfscout_event_emit( RFSCOUT_EVENT_DETECTED,\n                            (uint8_t)RFSCOUT_APP_WIFI_BT,\n                            (int32_t)a_observation->last_source );\n    }\n')

          Path('.github/workflows/pr39-wifi-discovery-config-helper.yml').unlink()
          PY
      - name: Install clang-format 18
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18
      - name: Format changed C sources
        run: python3 tools/check_format.py --all --fix
      - name: Commit WiFi discovery preferences
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make WiFi and BLE discovery sounds configurable"
          git push origin HEAD:feature/semantic-events-audio-policy
