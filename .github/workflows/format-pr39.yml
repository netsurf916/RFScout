name: PR39 format helper

on:
  push:
    branches:
      - feature/semantic-events-audio-policy

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/semantic-events-audio-policy
      - name: Install clang-format 18
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18
      - name: Apply repository formatting
        run: python3 tools/check_format.py --fix
      - name: Commit canonical formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Apply clang-format to semantic audio rework"
          git push origin HEAD:feature/semantic-events-audio-policy
