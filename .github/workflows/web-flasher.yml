name: Publish browser flasher

on:
  workflow_run:
    workflows:
      - Build and formatting
    types:
      - completed
  pull_request:
    types:
      - closed
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: rfscout-web-flasher
  cancel-in-progress: true

jobs:
  build-site:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'release' ||
      github.event_name == 'pull_request' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Stage flasher application
        run: |
          mkdir -p site
          cp -R web/flasher/. site/
          cp assets/logo.png site/logo.png

      - name: Mirror published firmware releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/firmware/releases
          gh release list \
            --exclude-drafts \
            --limit 20 \
            --json tagName,name,isPrerelease,publishedAt \
            > releases.json

          jq -r '.[].tagName' releases.json | while IFS= read -r tag; do
            assets=$(gh release view "$tag" --json assets --jq '.assets[].name')
            manifest_present=false
            full_image_present=false
            while IFS= read -r asset; do
              if [[ "$asset" == "manifest.web.json" ]]; then
                manifest_present=true
              fi
              if [[ "$asset" == rfscout-*-full.bin ]]; then
                full_image_present=true
              fi
            done <<< "$assets"

            if [[ "$manifest_present" != "true" || "$full_image_present" != "true" ]]; then
              echo "Skipping $tag because it does not contain web-flasher assets"
              continue
            fi

            destination="site/firmware/releases/$tag"
            mkdir -p "$destination"
            gh release download "$tag" \
              --pattern 'manifest.web.json' \
              --pattern 'rfscout-*-full.bin' \
              --dir "$destination"
          done

      - name: Collect current pull request candidates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p candidates
          printf '[]\n' > candidates.json

          gh pr list \
            --state open \
            --limit 100 \
            --json number,headRefOid \
            --jq '.[] | [.number, .headRefOid] | @tsv' \
          | while IFS=$'\t' read -r pr sha; do
              runs=$(gh api --method GET \
                "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs" \
                -f event=pull_request \
                -f status=success \
                -f head_sha="$sha" \
                -f per_page=20)

              run=$(jq -c --argjson pr "$pr" \
                '[.workflow_runs[] | select(any(.pull_requests[]?; .number == $pr))][0] // empty' \
                <<< "$runs")
              if [[ -z "$run" ]]; then
                echo "Skipping PR #$pr: no successful build for current head $sha"
                continue
              fi

              run_id=$(jq -r '.id' <<< "$run")
              run_url=$(jq -r '.html_url' <<< "$run")
              artifact_name=$(gh api \
                "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" \
                --jq '[.artifacts[] | select((.expired | not) and (.name | startswith("rfscout-candidate-")))] | .[0].name // empty')
              if [[ -z "$artifact_name" ]]; then
                echo "Skipping PR #$pr: candidate artifact is unavailable or expired"
                continue
              fi

              gh run download "$run_id" \
                --name "$artifact_name" \
                --dir "candidates/pr-$pr"

              temporary=$(mktemp)
              jq \
                --argjson pr "$pr" \
                --arg sha "$sha" \
                --arg run_url "$run_url" \
                '. + [{pr: $pr, sha: $sha, run_url: $run_url}]' \
                candidates.json > "$temporary"
              mv "$temporary" candidates.json
            done

      - name: Build firmware catalog
        run: |
          python3 tools/build_web_flasher.py \
            --site-dir site \
            --releases-json releases.json \
            --candidate-root candidates \
            --candidates-json candidates.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build-site
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy browser flasher
        id: deployment
        uses: actions/deploy-pages@v5
