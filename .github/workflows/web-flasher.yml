name: Publish RFScout Pages

on:
  workflow_run:
    workflows:
      - Build and formatting
    types:
      - completed
  pull_request:
    types:
      - closed
  release:
    types:
      - published
      - deleted
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: rfscout-pages
  cancel-in-progress: true

jobs:
  refresh-after-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    steps:
      - name: Refresh RFScout Pages from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run web-flasher.yml --repo "$GITHUB_REPOSITORY" --ref main

  build-site:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_run' ||
      github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.stability.outputs.ready }}
      snapshot: ${{ steps.stability.outputs.snapshot }}

    steps:
      - name: Check catalog stability
        id: stability
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ready=true
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          printf 'main\t%s\n' "$main_sha" > heads.tsv

          main_runs=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs" \
            -f head_sha="$main_sha" -f per_page=100)
          main_matching=$(jq -c \
            '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")]' \
            <<< "$main_runs")
          main_count=$(jq 'length' <<< "$main_matching")
          main_pending=$(jq '[.[] | select(.status != "completed")] | length' <<< "$main_matching")
          main_success=$(jq '[.[] | select(.status == "completed" and .conclusion == "success")] | length' <<< "$main_matching")
          if [[ "$main_count" -eq 0 ]]; then
            echo "Deferring Pages refresh: current main $main_sha has no Build and formatting run yet"
            ready=false
          elif [[ "$main_pending" -ne 0 ]]; then
            echo "Deferring Pages refresh: current main $main_sha is still building"
            ready=false
          elif [[ "$main_success" -eq 0 ]]; then
            echo "Deferring Pages refresh: current main $main_sha has no successful completed CI run"
            ready=false
          fi

          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" \
            --jq '.[] | [.number, .head.sha, .draft] | @tsv' | sort -n -k1,1 >> heads.tsv

          while IFS=$'\t' read -r pr sha draft; do
            [[ "$pr" == "main" ]] && continue
            runs=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs" \
              -f event=pull_request -f head_sha="$sha" -f per_page=100)
            matching=$(jq -c --argjson pr "$pr" '[.workflow_runs[] | select(any(.pull_requests[]?; .number == $pr))]' <<< "$runs")
            count=$(jq 'length' <<< "$matching")
            pending=$(jq '[.[] | select(.status != "completed")] | length' <<< "$matching")
            if [[ "$draft" != "true" && "$count" -eq 0 ]]; then
              echo "Deferring Pages refresh: PR #$pr current head has no build"
              ready=false
            elif [[ "$pending" -ne 0 ]]; then
              echo "Deferring Pages refresh: PR #$pr current head is still building"
              ready=false
            fi
          done < heads.tsv

          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          echo "snapshot=$(base64 -w 0 heads.tsv)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        if: steps.stability.outputs.ready == 'true'
        with:
          ref: main

      - name: Stage flasher application
        if: steps.stability.outputs.ready == 'true'
        run: |
          mkdir -p site
          cp -R web/flasher/. site/
          cp assets/logo.png site/logo.png

      - name: Mirror browser-flasher releases including drafts
        if: steps.stability.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/firmware/releases
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '[.[] | {tagName: .tag_name, name: .name, isDraft: .draft, isPrerelease: .prerelease, publishedAt: .published_at, createdAt: .created_at}] | .[]' \
            | jq -s '
                (map(select(.isDraft)) | sort_by(.createdAt // "") | reverse) +
                (map(select(.isDraft | not)) | sort_by(.publishedAt // .createdAt // "") | reverse | .[:20])
              ' > releases.json

          jq -r '.[].tagName' releases.json | while IFS= read -r tag; do
            assets=$(gh release view "$tag" --json assets --jq '.assets[].name')
            if ! grep -qx 'manifest.web.json' <<< "$assets" || ! grep -Eq '^rfscout-.*-full\.bin$' <<< "$assets"; then
              echo "Skipping $tag because it does not contain web-flasher assets"
              continue
            fi
            destination="site/firmware/releases/$tag"
            mkdir -p "$destination"
            gh release download "$tag" --pattern manifest.json --pattern manifest.web.json \
              --pattern 'rfscout-*-full.bin' --dir "$destination"

            if grep -qx 'ota-image.json' <<< "$assets"; then
              gh release download "$tag" --pattern ota-image.json --dir "$destination"
              artifact=$(jq -r '.artifact.file // empty' "$destination/ota-image.json")
              if [[ -z "$artifact" ]] || ! grep -Fxq "$artifact" <<< "$assets"; then
                echo "OTA metadata for $tag references missing asset: $artifact" >&2
                exit 1
              fi
              gh release download "$tag" --pattern "$artifact" --dir "$destination"
            fi
          done

      - name: Collect current main and pull request candidates
        if: steps.stability.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p candidates
          printf '[]\n' > candidates.json

          collect_candidate() {
            source=$1
            sha=$2
            pr=${3:-}
            if [[ "$source" == main ]]; then
              runs=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs" \
                -f status=success -f head_sha="$sha" -f per_page=100)
            else
              runs=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs" \
                -f event=pull_request -f status=success -f head_sha="$sha" -f per_page=100)
            fi

            run=""
            artifact=""
            while IFS= read -r candidate_run; do
              run_id=$(jq -r .id <<< "$candidate_run")
              candidate_artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" \
                --jq '[.artifacts[] | select((.expired | not) and (.name | startswith("rfscout-candidate-")))] | .[0].name // empty')
              if [[ -n "$candidate_artifact" ]]; then
                run="$candidate_run"
                artifact="$candidate_artifact"
                break
              fi
            done < <(
              if [[ "$source" == main ]]; then
                jq -c '.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")' \
                  <<< "$runs"
              else
                jq -c --argjson pr "$pr" \
                  '.workflow_runs[] | select(any(.pull_requests[]?; .number == $pr))' \
                  <<< "$runs"
              fi
            )

            [[ -z "$run" ]] && { echo "Skipping $source: no live successful candidate for $sha"; return; }
            run_id=$(jq -r .id <<< "$run")
            run_url=$(jq -r .html_url <<< "$run")
            created_at=$(jq -r .created_at <<< "$run")
            destination=$([[ "$source" == main ]] && echo candidates/main || echo "candidates/pr-$pr")
            gh run download "$run_id" --name "$artifact" --dir "$destination"
            temporary=$(mktemp)
            jq --arg source "$source" --arg sha "$sha" --arg run_url "$run_url" --arg created_at "$created_at" --arg pr "$pr" \
              '. + [{source: $source, sha: $sha, run_url: $run_url, created_at: $created_at} + (if $pr == "" then {} else {pr: ($pr|tonumber)} end)]' \
              candidates.json > "$temporary"
            mv "$temporary" candidates.json
          }

          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          collect_candidate main "$main_sha"
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --jq '.[] | [.number, .head.sha] | @tsv' \
            | while IFS=$'\t' read -r pr sha; do collect_candidate pull_request "$sha" "$pr"; done

      - name: Build Pages firmware catalogs
        if: steps.stability.outputs.ready == 'true'
        run: |
          python3 tools/build_web_flasher.py --site-dir site --releases-json releases.json \
            --candidate-root candidates --candidates-json candidates.json

      - name: Configure GitHub Pages
        if: steps.stability.outputs.ready == 'true'
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: steps.stability.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build-site
    if: needs.build-site.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Revalidate catalog head snapshot
        id: revalidate
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SNAPSHOT: ${{ needs.build-site.outputs.snapshot }}
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          printf 'main\t%s\n' "$main_sha" > heads.tsv
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" \
            --jq '.[] | [.number, .head.sha, .draft] | @tsv' | sort -n -k1,1 >> heads.tsv
          if [[ "$(base64 -w 0 heads.tsv)" != "$EXPECTED_SNAPSHOT" ]]; then
            echo "Catalog heads changed while site was assembled; deferring deployment"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy RFScout Pages
        if: steps.revalidate.outputs.ready == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
