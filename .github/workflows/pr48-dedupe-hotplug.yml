name: PR48 dedupe hotplug probe

on: [push]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: detect-radio-hardware-apps
      - name: Remove duplicate hotplug probe
        run: >-
          python3 -c 'from pathlib import Path; p=Path("main/app_manager.c"); s=p.read_text(); s=s.replace("static rfscout_app_id_t next_available_app( int a_direction, int64_t a_now )", "static rfscout_app_id_t next_available_app( int a_direction )", 1); old="        if( !app_available( candidate ) )\n        {\n            if( RFSCOUT_APP_PROBE_HOTPLUG == app_framework_probe_policy( candidate ) )\n            {\n                app_framework_refresh_hotplug( candidate );\n                last_hotplug_probe_us = a_now;\n                if( app_available( candidate ) )\n                {\n                    return candidate;\n                }\n            }\n            continue;\n        }"; new="        if( !app_available( candidate ) )\n        {\n            continue;\n        }"; assert old in s; s=s.replace(old,new,1); s=s.replace("next_available_app( direction, a_now )", "next_available_app( direction )", 1); p.write_text(s)'
      - name: Format and commit
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18
          clang-format-18 -i main/app_manager.c
          git config user.name "Daniel Wilson"
          git config user.email "netsurf916@users.noreply.github.com"
          git add main/app_manager.c
          git commit -m "Avoid duplicate hotplug probes during navigation"
          git push origin HEAD:detect-radio-hardware-apps
