name: PR72 cleanup
on:
  push:
    branches:
      - design/service-provider-events
    paths:
      - .github/workflows/pr72-cleanup.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 .github/pr72_cleanup.py
          git rm .github/pr72_cleanup.py .github/workflows/pr72-cleanup.yml
          git add main docs
          git commit -m "Simplify hardware availability semantics"
          git push origin HEAD:design/service-provider-events
