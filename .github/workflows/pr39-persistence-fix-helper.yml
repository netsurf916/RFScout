name: PR39 persistence fix helper

on:
  push:
    branches:
      - feature/semantic-events-audio-policy

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/semantic-events-audio-policy
          fetch-depth: 0
      - name: Finalize persistence details
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'expected text not found in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          # Remove literal NUL bytes accidentally introduced by the migration generator.
          p = Path('main/device_config.c')
          raw = p.read_bytes()
          if b'\x00' in raw:
              raw = raw.replace(b'\x00', b'\\0')
              p.write_bytes(raw)

          # Make NULL ownership explicit in the retained-state implementation.
          replace('main/session_state.c', '#include <stdint.h>\n', '#include <stddef.h>\n#include <stdint.h>\n')

          # Restore a retained app only after optional hardware has been initialized/probed.
          old = '''    active_app = device_config_startup_app();
              rfscout_session_state_t restored_session;
              if( session_state_restore( &restored_session ) && app_available( restored_session.active_app ) )
              {
                  active_app = restored_session.active_app;
              }
              last_app_refresh_us = 0;'''
          new = '''    active_app = device_config_startup_app();
              rfscout_session_state_t restored_session;
              const bool have_restored_session = session_state_restore( &restored_session );
              last_app_refresh_us = 0;'''
          replace('main/app_manager.c', old, new)
          old = '''    (void)mlx90640_init();
              if( !app_available( active_app ) )
              {
                  ESP_LOGW( TAG, "configured startup app unavailable; using Home" );
                  active_app = RFSCOUT_APP_DEVICE;
              }'''
          new = '''    (void)mlx90640_init();
              if( have_restored_session && app_available( restored_session.active_app ) )
              {
                  active_app = restored_session.active_app;
              }
              if( !app_available( active_app ) )
              {
                  ESP_LOGW( TAG, "configured or retained app unavailable; using Home" );
                  active_app = RFSCOUT_APP_DEVICE;
              }'''
          replace('main/app_manager.c', old, new)

          # Track runtime config changes so sleep can safely flush only when needed.
          replace('main/device_config.h', 'esp_err_t device_config_save( bool a_update_time, int64_t a_epoch, const char *a_time_source );\n',
                  'esp_err_t device_config_save( bool a_update_time, int64_t a_epoch, const char *a_time_source );\n/** @brief Persist runtime preferences only when a setter has changed canonical configuration. */\nesp_err_t device_config_save_if_dirty( void );\n')

          replace('main/device_config.c', 'static char saved_time_source[ 24 ];\n', 'static char saved_time_source[ 24 ];\nstatic bool config_dirty;\n')
          replace('main/device_config.c', '    saved_time_source[ 0 ] = \'\\0\';\n}', '    saved_time_source[ 0 ] = \'\\0\';\n    config_dirty = false;\n}')

          setters = [
              ('    config.apps_enabled[ a_app ] = a_enabled;\n    return ESP_OK;\n',
               '    if( config.apps_enabled[ a_app ] != a_enabled )\n    {\n        config.apps_enabled[ a_app ] = a_enabled;\n        config_dirty = true;\n    }\n    return ESP_OK;\n'),
              ('    config.startup_app = a_app;\n    return ESP_OK;\n',
               '    if( config.startup_app != a_app )\n    {\n        config.startup_app = a_app;\n        config_dirty = true;\n    }\n    return ESP_OK;\n'),
              ('    config.theme = a_theme;\n    return ESP_OK;\n',
               '    if( config.theme != a_theme )\n    {\n        config.theme = a_theme;\n        config_dirty = true;\n    }\n    return ESP_OK;\n'),
              ('    config.notification_app_enabled[ a_app ] = a_enabled;\n    return ESP_OK;\n',
               '    if( config.notification_app_enabled[ a_app ] != a_enabled )\n    {\n        config.notification_app_enabled[ a_app ] = a_enabled;\n        config_dirty = true;\n    }\n    return ESP_OK;\n'),
              ('    config.logging_enabled = a_enabled;\n    return ESP_OK;\n',
               '    if( config.logging_enabled != a_enabled )\n    {\n        config.logging_enabled = a_enabled;\n        config_dirty = true;\n    }\n    return ESP_OK;\n'),
              ('    config.brightness_percent = a_percent;\n    return ESP_OK;\n',
               '    if( config.brightness_percent != a_percent )\n    {\n        config.brightness_percent = a_percent;\n        config_dirty = true;\n    }\n    return ESP_OK;\n'),
              ('    config.clock_24h = a_enabled;\n    return ESP_OK;\n',
               '    if( config.clock_24h != a_enabled )\n    {\n        config.clock_24h = a_enabled;\n        config_dirty = true;\n    }\n    return ESP_OK;\n'),
              ('    config.alert_mode = a_mode;\n    alert_set_mode( a_mode );\n',
               '    if( config.alert_mode != a_mode )\n    {\n        config.alert_mode = a_mode;\n        config_dirty = true;\n    }\n    alert_set_mode( a_mode );\n'),
              ('    config.alert_volume_percent = a_percent;\n    return ESP_OK;\n',
               '    if( config.alert_volume_percent != a_percent )\n    {\n        config.alert_volume_percent = a_percent;\n        config_dirty = true;\n    }\n    return ESP_OK;\n'),
              ('    config.recorder_volume_percent = a_percent;\n    return ESP_OK;\n',
               '    if( config.recorder_volume_percent != a_percent )\n    {\n        config.recorder_volume_percent = a_percent;\n        config_dirty = true;\n    }\n    return ESP_OK;\n'),
              ('    config.recorder_input_gain_db = a_gain_db;\n    return ESP_OK;\n',
               '    if( config.recorder_input_gain_db != a_gain_db )\n    {\n        config.recorder_input_gain_db = a_gain_db;\n        config_dirty = true;\n    }\n    return ESP_OK;\n'),
              ('    config.notification_characters[ a_type ] = character;\n    return ESP_OK;\n',
               '    if( config.notification_characters[ a_type ] != character )\n    {\n        config.notification_characters[ a_type ] = character;\n        config_dirty = true;\n    }\n    return ESP_OK;\n'),
              ('            copy_string( config.timezone_selected, sizeof( config.timezone_selected ), a_name );\n            return ESP_OK;\n',
               '            if( 0 != strcmp( config.timezone_selected, a_name ) )\n            {\n                copy_string( config.timezone_selected, sizeof( config.timezone_selected ), a_name );\n                config_dirty = true;\n            }\n            return ESP_OK;\n'),
          ]
          for old, new in setters:
              replace('main/device_config.c', old, new)

          # Loading a legacy schema should be clean runtime state; canonicalization occurs on the next real save.
          replace('main/device_config.c', '    if( ESP_OK == result )\n    {\n        ESP_LOGI( TAG, "loaded %s", RFSCOUT_CONFIG_PATH );\n        return ESP_OK;\n    }\n',
                  '    if( ESP_OK == result )\n    {\n        config_dirty = false;\n        ESP_LOGI( TAG, "loaded %s", RFSCOUT_CONFIG_PATH );\n        return ESP_OK;\n    }\n')

          # Mark a successful canonical save clean, and expose a sleep-safe conditional flush.
          old = '''    if( !ok )
              {
                  (void)unlink( CONFIG_TEMP_PATH );
                  return ESP_FAIL;
              }
              return replace_config_file();
          }'''
          new = '''    if( !ok )
              {
                  (void)unlink( CONFIG_TEMP_PATH );
                  return ESP_FAIL;
              }
              const esp_err_t result = replace_config_file();
              if( ESP_OK == result )
              {
                  config_dirty = false;
              }
              return result;
          }

          esp_err_t device_config_save_if_dirty( void )
          {
              return config_dirty ? device_config_save( false, 0, NULL ) : ESP_OK;
          }'''
          replace('main/device_config.c', old, new)

          # Sleep must flush any in-page edits before storage is unmounted.
          old = '''    if( a_checkpoint_time )
              {
                  const esp_err_t checkpoint = device_time_checkpoint();'''
          new = '''    if( !a_checkpoint_time )
              {
                  const esp_err_t save_result = device_config_save_if_dirty();
                  if( ESP_OK != save_result )
                  {
                      ESP_LOGW( TAG, "configuration save before sleep failed: %s", esp_err_to_name( save_result ) );
                      return false;
                  }
              }

              if( a_checkpoint_time )
              {
                  const esp_err_t checkpoint = device_time_checkpoint();'''
          replace('main/power.c', old, new)

          # Helper must not remain in the product branch.
          Path('.github/workflows/pr39-persistence-fix-helper.yml').unlink()
          PY
      - name: Install clang-format 18
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18
      - name: Format
        run: python3 tools/check_format.py --all --fix
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize configuration and sleep persistence"
          git push origin HEAD:feature/semantic-events-audio-policy
