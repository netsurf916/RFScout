name: Device settings integration

on:
  push:
    branches:
      - feature/device-settings

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install clang-format 18
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18

      - name: Apply Device settings integration
        run: |
          python3 tools/fix_device_settings_new_files.py
          python3 tools/apply_device_settings_integration.py
          python3 tools/check_format.py --all --fix
          python3 tools/check_format.py --all

      - name: Commit integrated sources
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No integration changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main
          git commit -m "Integrate Device settings and wall clock"
          git push
