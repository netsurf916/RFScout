name: PR48 mic and menu follow-up

on:
  push:
    branches:
      - detect-radio-hardware-apps

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: detect-radio-hardware-apps
          fetch-depth: 0

      - name: Apply microphone probe and menu ordering
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"pattern not found in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          replace("main/recorder.c",
                  '#include "driver/i2s_pdm.h"\n#include "driver/pulse_cnt.h"',
                  '#include "driver/gpio.h"\n#include "driver/i2s_pdm.h"\n#include "driver/pulse_cnt.h"')
          replace("main/recorder.c",
                  '#define RECORDER_CLOCK_MEASURE_MS 10U\n#define RECORDER_SIGNAL_SNAPSHOT_THRESHOLD 4000U',
                  '#define RECORDER_CLOCK_MEASURE_MS 10U\n#define RECORDER_MIC_PROBE_MS 5U\n#define RECORDER_MIC_PROBE_MIN_EDGES 32U\n#define RECORDER_SIGNAL_SNAPSHOT_THRESHOLD 4000U')

          marker = 'static void log_pcm_snapshot( const char *a_label, const int16_t *a_samples, size_t a_count )\n'
          helper = '''static uint32_t measure_pdm_data_edges( void )
          {
              pcnt_unit_handle_t unit = NULL;
              pcnt_channel_handle_t channel = NULL;
              const pcnt_unit_config_t unit_config = { .low_limit = -1, .high_limit = 30000 };
              esp_err_t result = pcnt_new_unit( &unit_config, &unit );
              if( ESP_OK != result )
              {
                  return 0U;
              }

              const pcnt_chan_config_t channel_config = {
                  .edge_gpio_num = RFSCOUT_BOARD_MIC_DATA_PIN,
                  .level_gpio_num = -1,
                  .flags = { .virt_level_io_level = 1 },
              };
              result = pcnt_new_channel( unit, &channel_config, &channel );
              if( ESP_OK == result )
              {
                  result = pcnt_channel_set_edge_action(
                      channel, PCNT_CHANNEL_EDGE_ACTION_INCREASE, PCNT_CHANNEL_EDGE_ACTION_HOLD );
              }
              if( ESP_OK == result )
              {
                  result = pcnt_unit_enable( unit );
              }
              if( ESP_OK == result )
              {
                  (void)pcnt_unit_clear_count( unit );
                  result = pcnt_unit_start( unit );
              }

              int count = 0;
              if( ESP_OK == result )
              {
                  vTaskDelay( pdMS_TO_TICKS( RECORDER_MIC_PROBE_MS ) );
                  (void)pcnt_unit_stop( unit );
                  result = pcnt_unit_get_count( unit, &count );
              }

              if( NULL != unit )
              {
                  (void)pcnt_unit_disable( unit );
              }
              if( NULL != channel )
              {
                  (void)pcnt_del_channel( channel );
              }
              if( NULL != unit )
              {
                  (void)pcnt_del_unit( unit );
              }
              return ESP_OK == result && count > 0 ? (uint32_t)count : 0U;
          }

          '''
          replace("main/recorder.c", marker, helper + marker)

          marker = 'static void make_recording_name( char *a_name, size_t a_capacity )\n'
          probe = '''esp_err_t recorder_probe_microphone( void )
          {
              if( NULL != rx_channel || NULL != record_task || NULL != monitor_task )
              {
                  return ESP_ERR_INVALID_STATE;
              }

              esp_err_t result = open_microphone();
              uint32_t edges = 0U;
              if( ESP_OK == result )
              {
                  (void)gpio_set_pull_mode( RFSCOUT_BOARD_MIC_DATA_PIN, GPIO_PULLDOWN_ONLY );
                  vTaskDelay( pdMS_TO_TICKS( RECORDER_MIC_WAKEUP_MS ) );
                  edges = measure_pdm_data_edges();
                  release_channel();
              }
              (void)gpio_set_pull_mode( RFSCOUT_BOARD_MIC_DATA_PIN, GPIO_FLOATING );

              if( ESP_OK != result )
              {
                  ESP_LOGW( TAG, "microphone probe setup failed: %s", esp_err_to_name( result ) );
                  return result;
              }
              if( edges < RECORDER_MIC_PROBE_MIN_EDGES )
              {
                  ESP_LOGI( TAG,
                            "microphone probe: data_edges=%u/%ums; not detected",
                            (unsigned)edges,
                            (unsigned)RECORDER_MIC_PROBE_MS );
                  return ESP_ERR_NOT_FOUND;
              }

              ESP_LOGI( TAG,
                        "microphone probe: data_edges=%u/%ums; detected",
                        (unsigned)edges,
                        (unsigned)RECORDER_MIC_PROBE_MS );
              return ESP_OK;
          }

          '''
          replace("main/recorder.c", marker, probe + marker)
          replace("main/recorder.h",
                  '/** @brief Initialize recorder state and enumerate valid WAV files when storage is mounted. */\nesp_err_t recorder_init( void );',
                  '/** @brief Briefly clock the board PDM input and detect microphone data activity. */\nesp_err_t recorder_probe_microphone( void );\n\n/** @brief Initialize recorder state and enumerate valid WAV files when storage is mounted. */\nesp_err_t recorder_init( void );')

          replace("main/app_manager.c",
                  'static bool cc1101_available;\nstatic bool nrf24_available;',
                  'static bool cc1101_available;\nstatic bool nrf24_available;\nstatic bool microphone_available;')
          replace("main/app_manager.c",
                  '''    if( RFSCOUT_APP_NRF24 == a_app )
              {
                  return nrf24_available;
              }
              return ( RFSCOUT_APP_THERMAL != a_app ) || mlx90640_is_detected();''',
                  '''    if( RFSCOUT_APP_NRF24 == a_app )
              {
                  return nrf24_available;
              }
              if( RFSCOUT_APP_AUDIO == a_app )
              {
                  return microphone_available;
              }
              return ( RFSCOUT_APP_THERMAL != a_app ) || mlx90640_is_detected();''')
          replace("main/app_manager.c",
                  '    cc1101_available = false;\n    nrf24_available = false;',
                  '    cc1101_available = false;\n    nrf24_available = false;\n    microphone_available = false;')
          replace("main/app_manager.c",
                  '''    ESP_LOGI( TAG,
                        "nRF24 hardware %s",
                        nrf24_available ? "detected; app available" : "not detected; app hidden" );

              if( have_restored_session''',
                  '''    ESP_LOGI( TAG,
                        "nRF24 hardware %s",
                        nrf24_available ? "detected; app available" : "not detected; app hidden" );

              const esp_err_t microphone_result = recorder_probe_microphone();
              microphone_available = ( ESP_OK == microphone_result );
              ESP_LOGI( TAG,
                        "PDM microphone %s",
                        microphone_available ? "detected; Recorder available"
                                             : "not detected; Recorder hidden" );

              if( have_restored_session''')

          replace("main/app_manager.c",
                  '''#define WIFI_MENU_BACK 0U
          #define WIFI_MENU_NOTIFICATIONS 1U
          #define WIFI_MENU_WIFI_TIMEOUT 2U
          #define WIFI_MENU_BLE_TIMEOUT 3U
          #define WIFI_MENU_SURVEILLANCE_TIMEOUT 4U
          #define WIFI_MENU_RESET 5U''',
                  '''#define WIFI_MENU_BACK 0U
          #define WIFI_MENU_RESET 1U
          #define WIFI_MENU_NOTIFICATIONS 2U
          #define WIFI_MENU_WIFI_TIMEOUT 3U
          #define WIFI_MENU_BLE_TIMEOUT 4U
          #define WIFI_MENU_SURVEILLANCE_TIMEOUT 5U''')
          replace("main/app_manager.c",
                  '''#define CC1101_MENU_BACK 0U
          #define CC1101_MENU_PROFILE 1U
          #define CC1101_MENU_LOW 2U
          #define CC1101_MENU_HIGH 3U
          #define CC1101_MENU_STEP 4U
          #define CC1101_MENU_NOTIFICATIONS 5U
          #define CC1101_MENU_RESET_COUNTS 6U''',
                  '''#define CC1101_MENU_BACK 0U
          #define CC1101_MENU_RESET_COUNTS 1U
          #define CC1101_MENU_PROFILE 2U
          #define CC1101_MENU_LOW 3U
          #define CC1101_MENU_HIGH 4U
          #define CC1101_MENU_STEP 5U
          #define CC1101_MENU_NOTIFICATIONS 6U''')
          replace("main/app_manager.c",
                  '''#define NRF24_MENU_BACK 0U
          #define NRF24_MENU_LOW 1U
          #define NRF24_MENU_HIGH 2U
          #define NRF24_MENU_DWELL 3U
          #define NRF24_MENU_PACKETS 4U
          #define NRF24_MENU_NOTIFICATIONS 5U
          #define NRF24_MENU_RESET_COUNTS 6U''',
                  '''#define NRF24_MENU_BACK 0U
          #define NRF24_MENU_RESET_COUNTS 1U
          #define NRF24_MENU_LOW 2U
          #define NRF24_MENU_HIGH 3U
          #define NRF24_MENU_DWELL 4U
          #define NRF24_MENU_PACKETS 5U
          #define NRF24_MENU_NOTIFICATIONS 6U''')

          replace("main/wifi_settings_view.c",
                  '''    static const char *labels[ WIFI_SETTINGS_ITEM_COUNT ] = {
                  "BACK", "NOTIFICATIONS", "WIFI TIMEOUT", "BT TIMEOUT", "SURV TIMEOUT", "RESET DETECTIONS" };''',
                  '''    static const char *labels[ WIFI_SETTINGS_ITEM_COUNT ] = {
                  "BACK", "RESET DETECTIONS", "NOTIFICATIONS", "WIFI TIMEOUT", "BT TIMEOUT", "SURV TIMEOUT" };''')
          replace("main/wifi_settings_view.c",
                  '        const bool editable = ( item >= 2U ) && ( item <= 4U );',
                  '        const bool editable = ( item >= 3U ) && ( item <= 5U );')
          replace("main/wifi_settings_view.c",
                  '''        if( 1U == item )
                  {
                      snprintf( value, sizeof( value ), "%s", a_notifications_enabled ? "ON" : "OFF" );
                  }
                  else if( 2U == item )
                  {
                      snprintf( value, sizeof( value ), "%u s", (unsigned)a_wifi_timeout_seconds );
                  }
                  else if( 3U == item )
                  {
                      snprintf( value, sizeof( value ), "%u s", (unsigned)a_ble_timeout_seconds );
                  }
                  else if( 4U == item )
                  {
                      snprintf( value, sizeof( value ), "%u s", (unsigned)a_surveillance_timeout_seconds );
                  }''',
                  '''        if( 2U == item )
                  {
                      snprintf( value, sizeof( value ), "%s", a_notifications_enabled ? "ON" : "OFF" );
                  }
                  else if( 3U == item )
                  {
                      snprintf( value, sizeof( value ), "%u s", (unsigned)a_wifi_timeout_seconds );
                  }
                  else if( 4U == item )
                  {
                      snprintf( value, sizeof( value ), "%u s", (unsigned)a_ble_timeout_seconds );
                  }
                  else if( 5U == item )
                  {
                      snprintf( value, sizeof( value ), "%u s", (unsigned)a_surveillance_timeout_seconds );
                  }''')

          # Replace complete menu functions so label/value indices remain internally consistent.
          p = Path("main/radio_app_view.c")
          text = p.read_text()
          cc_start = text.index("void radio_app_view_cc1101_menu(")
          nr_start = text.index("void radio_app_view_nrf24_spectrum(", cc_start)
          cc = text[cc_start:nr_start]
          cc = cc.replace('''    static const char *labels[ CC_MENU_ITEM_COUNT ] = {
                  "BACK",
                  "PROFILE",
                  "LOW",
                  "HIGH",
                  "STEP",
                  "NOTIFICATIONS",
                  "RESET COUNTS",
              };''', '''    static const char *labels[ CC_MENU_ITEM_COUNT ] = {
                  "BACK",
                  "RESET COUNTS",
                  "PROFILE",
                  "LOW",
                  "HIGH",
                  "STEP",
                  "NOTIFICATIONS",
              };''')
          cc = cc.replace('const bool action = ( 0U == i ) || ( 5U == i ) || ( 6U == i );',
                          'const bool action = ( 0U == i ) || ( 1U == i ) || ( 6U == i );')
          cc = cc.replace('if( 1U == i )', 'if( 2U == i )', 1)
          cc = cc.replace('else if( 2U == i )', 'else if( 3U == i )', 1)
          cc = cc.replace('else if( 3U == i )', 'else if( 4U == i )', 1)
          cc = cc.replace('else if( 4U == i )', 'else if( 5U == i )', 1)
          cc = cc.replace('else if( 5U == i )', 'else if( 6U == i )', 1)
          text = text[:cc_start] + cc + text[nr_start:]

          nr_start = text.index("void radio_app_view_nrf24_menu(")
          nr_end = len(text)
          nr = text[nr_start:nr_end]
          nr = nr.replace('''    static const char *labels[ NRF24_MENU_ITEM_COUNT ] = {
                  "BACK", "LOW CH", "HIGH CH", "DWELL", "PACKETS", "NOTIFICATIONS", "RESET COUNTS" };''',
                          '''    static const char *labels[ NRF24_MENU_ITEM_COUNT ] = {
                  "BACK", "RESET COUNTS", "LOW CH", "HIGH CH", "DWELL", "PACKET DETAILS", "NOTIFICATIONS" };''')
          nr = nr.replace('const bool action = ( 0U == i ) || ( 4U == i ) || ( 5U == i ) || ( 6U == i );',
                          'const bool action = ( 0U == i ) || ( 1U == i ) || ( 5U == i ) || ( 6U == i );')
          old_values = '''        if( 1U == i )
                  {
                      snprintf( value,
                                sizeof( value ),
                                "%u / %u MHz",
                                (unsigned)a_low_channel,
                                (unsigned)( 2400U + a_low_channel ) );
                  }
                  else if( 2U == i )
                  {
                      snprintf( value,
                                sizeof( value ),
                                "%u / %u MHz",
                                (unsigned)a_high_channel,
                                (unsigned)( 2400U + a_high_channel ) );
                  }
                  else if( 3U == i )
                  {
                      snprintf( value, sizeof( value ), "%u us", (unsigned)a_dwell_us );
                  }
                  else if( 5U == i )
                  {
                      snprintf( value, sizeof( value ), "%s", a_notifications_enabled ? "ON" : "OFF" );
                  }'''
          new_values = '''        if( 2U == i )
                  {
                      snprintf( value,
                                sizeof( value ),
                                "%u / %u MHz",
                                (unsigned)a_low_channel,
                                (unsigned)( 2400U + a_low_channel ) );
                  }
                  else if( 3U == i )
                  {
                      snprintf( value,
                                sizeof( value ),
                                "%u / %u MHz",
                                (unsigned)a_high_channel,
                                (unsigned)( 2400U + a_high_channel ) );
                  }
                  else if( 4U == i )
                  {
                      snprintf( value, sizeof( value ), "%u us", (unsigned)a_dwell_us );
                  }
                  else if( 6U == i )
                  {
                      snprintf( value, sizeof( value ), "%s", a_notifications_enabled ? "ON" : "OFF" );
                  }'''
          if old_values not in nr:
              raise SystemExit("nRF24 menu value block not found")
          nr = nr.replace(old_values, new_values, 1)
          p.write_text(text[:nr_start] + nr)

          replace("docs/ARCHITECTURE.md",
                  'WiFi / BT -> CC1101 (when enabled and detected) -> nRF24 (when enabled and detected) -> Recorder -> Thermal (when enabled and present) -> Home / Device Settings',
                  'WiFi / BT -> CC1101 (when enabled and detected) -> nRF24 (when enabled and detected) -> Recorder (when enabled and microphone detected) -> Thermal (when enabled and present) -> Home / Device Settings')
          replace("docs/ARCHITECTURE.md",
                  'CC1101 and nRF24 are treated as board-population capabilities rather than hot-plug peripherals. `app_manager` probes each once during startup and includes its application in navigation only when initialization confirms that the radio is present. RFScout does not add status-bar indicators for these fixed radios. Thermal remains different: it is an explicitly attachable external sensor, so its runtime probe and availability feedback remain dynamic.',
                  'CC1101, nRF24, and the board PDM microphone are treated as board-population capabilities rather than hot-plug peripherals. `app_manager` probes each once during startup and includes its application in navigation only when the corresponding hardware is present. The microphone probe briefly starts the PDM clock and checks for data transitions, then immediately releases I2S0. RFScout does not add status-bar indicators for this fixed hardware. Thermal remains different: it is an explicitly attachable external sensor, so its runtime probe and availability feedback remain dynamic.')
          replace("docs/CONFIGURATION.md",
                  'An application `enabled` value is a user preference, not a promise that the hardware exists. CC1101 and nRF24 are additionally gated by a one-time startup hardware probe; if the corresponding radio is absent, that application is omitted from navigation for the current boot even when configured enabled. The saved preference is preserved so the same configuration can be used across differently populated T-Embed variants. Thermal remains dynamically probed because it is an external attachable peripheral.',
                  'An application `enabled` value is a user preference, not a promise that the hardware exists. CC1101, nRF24, and Recorder are additionally gated by one-time startup hardware probes; if a fixed radio or the board PDM microphone is absent, that application is omitted from navigation for the current boot even when configured enabled. The saved preference is preserved so the same configuration can be used across differently populated T-Embed variants. Thermal remains dynamically probed because it is an external attachable peripheral.')
          replace("docs/BOARD_PORTING.md",
                  'Capabilities are compile-time constants by design. As drivers are separated into target-specific source sets, CMake should use the selected board and its capabilities to avoid compiling unsupported hardware into that firmware image. Compile-time capability means that a board target can support a device; it does not require every product variant using that target to populate the device. Fixed optional radios such as CC1101 and nRF24 may therefore be probed once at startup and exposed only when detected.',
                  'Capabilities are compile-time constants by design. As drivers are separated into target-specific source sets, CMake should use the selected board and its capabilities to avoid compiling unsupported hardware into that firmware image. Compile-time capability means that a board target can support a device; it does not require every product variant using that target to populate the device. Fixed optional devices such as CC1101, nRF24, and the board PDM microphone may therefore be probed once at startup and exposed only when detected.')
          replace("docs/APP_LIFECYCLE.md",
                  'Application availability is resolved before this lifecycle begins. Fixed optional radios such as CC1101 and nRF24 are probed once during startup; an absent radio removes its application from navigation for that boot. The probe may initialize reusable driver state, but it does not start scanning. Thermal remains dynamically probed because it is an explicitly attachable external peripheral.',
                  'Application availability is resolved before this lifecycle begins. Fixed optional hardware such as CC1101, nRF24, and the board PDM microphone is probed once during startup; absent hardware removes its application from navigation for that boot. Radio probes may initialize reusable driver state without starting scans. The microphone probe briefly clocks the PDM interface, verifies data-line activity, and releases I2S0 immediately; it does not start recording or monitoring. Thermal remains dynamically probed because it is an explicitly attachable external peripheral.')

      - name: Install clang-format 18
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18

      - name: Format, commit, and remove helper workflow
        run: |
          clang-format-18 -i main/app_manager.c main/recorder.c main/recorder.h main/radio_app_view.c main/wifi_settings_view.c
          rm .github/workflows/pr48-mic-menu-followup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main/app_manager.c main/recorder.c main/recorder.h main/radio_app_view.c main/wifi_settings_view.c docs/ARCHITECTURE.md docs/CONFIGURATION.md docs/BOARD_PORTING.md docs/APP_LIFECYCLE.md .github/workflows/pr48-mic-menu-followup.yml
          git commit -m "Probe microphone and prioritize reset actions"
          git push origin HEAD:detect-radio-hardware-apps
