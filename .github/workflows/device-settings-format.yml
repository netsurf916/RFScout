name: Device settings canonical formatter

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Install clang-format 18
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18

      - name: Canonicalize firmware sources
        run: |
          python3 tools/check_format.py --all --fix
          python3 tools/check_format.py --all

      - name: Commit canonical formatting
        shell: bash
        run: |
          if git diff --quiet -- main; then
            echo "Firmware tree is already canonical."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main
          git commit -m "Canonicalize Device settings sources"
          git push origin "HEAD:${{ github.head_ref }}"
