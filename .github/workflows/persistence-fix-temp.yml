name: Temporary persistence cleanup

on:
  push:
    branches:
      - feature/internal-config-storage

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/internal-config-storage
          fetch-depth: 0
      - name: Apply targeted persistence cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('main/device_config.c')
          text = path.read_text()
          old = '        if( config_upgrade_pending )\n'
          new = '        if( config_store_imported() || config_upgrade_pending )\n'
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text)

          for name in ('docs/ARCHITECTURE.md', 'docs/CAPABILITIES.md', 'docs/CONFIGURATION.md'):
              path = Path(name)
              text = path.read_text().replace('SPIFFS', 'LittleFS')
              path.write_text(text)
          PY
      - name: Install clang-format 18
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18
      - name: Apply canonical formatting
        run: python3 tools/check_format.py --all --fix
      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main/device_config.c main/config_store.c main/config_store.h docs/ARCHITECTURE.md docs/CAPABILITIES.md docs/CONFIGURATION.md
          git commit -m "Finalize internal persistence semantics"
          git push origin HEAD:feature/internal-config-storage
