name: Canonical format generation

on:
  push:
    branches:
      - chore/canonical-format

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install clang-format 18
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18

      - name: Canonically format all firmware C sources
        run: |
          export PATH="/usr/lib/llvm-18/bin:$PATH"
          python3 tools/check_format.py --all --fix
          python3 tools/check_format.py --all

      - name: Commit canonical formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Tree is already canonical."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main
          git commit -m "Canonicalize firmware formatting"
          git push
