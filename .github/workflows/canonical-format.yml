name: Canonical format generation

on:
  push:
    branches:
      - chore/canonical-format

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install clang-format 18
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18

      - name: Canonically format all firmware C sources
        run: |
          export PATH="/usr/lib/llvm-18/bin:$PATH"
          python3 tools/check_format.py --all --fix
          python3 tools/check_format.py --all
          git diff --binary > canonical-format.patch

      - name: Upload formatting patch
        uses: actions/upload-artifact@v4
        with:
          name: canonical-format-patch
          path: canonical-format.patch
          if-no-files-found: error
