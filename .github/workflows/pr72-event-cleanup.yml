name: Apply PR72 event cleanup
on:
  push:
    branches:
      - design/service-provider-events
    paths:
      - .github/workflows/pr72-event-cleanup.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 .github/fix_pr72_event_cleanup.py
          git rm .github/fix_pr72_event_cleanup.py .github/workflows/pr72-event-cleanup.yml
          git add main/system_events.c docs/ROADMAP.md
          git commit -m "Align availability event semantics"
          git push origin HEAD:design/service-provider-events
